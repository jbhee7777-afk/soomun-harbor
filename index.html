<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>소문 항구 탐정단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 가지 세계(맑은 낮의 항구)로 고정한 게임 화면: 라이트/다크 전환 없이 모든 색을 직접 지정 */
:root{
  --sea:#127C86; --sea-deep:#0B4B57; --foam:#DDF1EE; --foam2:#C6E8E3;
  --dock:#6E4527; --dock2:#8A5A35; --plank:#F4E4C6; --plank2:#EDD8B2;
  --buoy:#E2513A; --sun:#FFC23D; --ink:#16353D; --ink2:#4A6770; --paper:#FFFDF6;
  --ok:#2E9E5B; --line:rgba(22,53,61,.14);
  --disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--foam);color:var(--ink);font-family:var(--body);font-size:15px;
  background-image:radial-gradient(120% 60% at 50% -10%,#F3FBF9 0,transparent 60%),
  repeating-radial-gradient(circle at 0 100%,transparent 0 22px,rgba(18,124,134,.05) 22px 24px);
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.em{font-family:var(--emoji);line-height:1}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0}

/* ---------- 지도 화면 ---------- */
#map{overflow-y:auto;padding:20px 16px 40px}
.mapwrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero .gull{width:74px;height:74px;flex:none}
.hero h1{font-size:clamp(30px,5vw,46px);color:var(--sea-deep);letter-spacing:-.5px;line-height:1.05}
.hero p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.hero .grow{flex:1;min-width:220px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--paper);
  border:2px solid var(--line);font-family:var(--disp);font-size:16px}
.pill:hover{border-color:var(--sea)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sect h2{font-size:22px;color:var(--sea-deep)}
.sect span{color:var(--ink2);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{position:relative;text-align:left;background:var(--paper);border-radius:18px;padding:14px 14px 12px;
  border:2px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--tint)}
.tile .ic{font-size:40px}
.tile .theme{align-self:flex-start;font-size:12.5px;padding:3px 8px;border-radius:6px;color:#fff;background:var(--tint);font-weight:700;letter-spacing:.2px}
.tile .pl{font-family:var(--disp);font-size:19px}
.tile .rm{font-size:13px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pips{display:flex;gap:4px;margin-top:auto}
.pips i{width:100%;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--tint)}
.tile .stamp{position:absolute;top:10px;right:10px;font-family:var(--disp);font-size:13px;color:var(--ok);border:2px solid var(--ok);
  border-radius:8px;padding:1px 6px;transform:rotate(6deg);background:var(--paper)}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.tcard{width:74px;height:96px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.4)}
.tcard.got{border:2px solid var(--tint);background:var(--paper);box-shadow:0 3px 0 var(--tint)}
.tcard.got:hover{transform:translateY(-2px)}
.tcard:not(.got) .em{filter:grayscale(1);opacity:.25}

/* ---------- 게임 화면 ---------- */
#play{overflow-y:auto;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:8px;padding:8px 16px 10px;height:100%;box-sizing:border-box}
.topbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.res{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:999px;padding:5px 11px 5px 7px;
  font-family:var(--disp);font-size:17px;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.res small{font-family:var(--body);font-size:11px;color:var(--ink2);margin-left:2px}
.res .em{font-size:18px}
.topbar .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-size:20px}
.qbtn{background:var(--sun);border-color:#E3A516;font-family:var(--disp);font-size:16px;padding:6px 12px;border-radius:12px;border:2px solid #E3A516;display:inline-flex;gap:5px;align-items:center}

.scene{background:var(--paper);border-radius:18px;border:2px solid var(--line);padding:10px 12px;display:grid;
  grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;position:relative;overflow:hidden}
.scene::before{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:var(--tint)}
.scene .who{font-size:44px;grid-row:span 2}
.scene .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scene .ttl h2{font-size:20px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--tint);color:#fff;font-weight:700}
.rumor{font-size:13.5px;color:var(--ink2);line-height:1.35}
.rumor b{color:var(--buoy);font-weight:700}
.rumor.solved b{color:var(--ok)}
.rumor.solved q{text-decoration:line-through;text-decoration-color:var(--buoy)}
.deco{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding-bottom:6px}
.slot{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:var(--foam);border:2px dashed var(--foam2)}
.slot.off .em{filter:grayscale(1);opacity:.28}
.slot.on{background:var(--paper);border:2px solid var(--tint);animation:pop .5s}
.deco .sp{flex:1}
.next{font-family:var(--disp);font-size:16px;border-radius:12px;padding:8px 12px;background:var(--foam);color:var(--ink2);border:2px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.next.ready{background:var(--buoy);color:#fff;border-color:#B93A26;box-shadow:0 3px 0 #B93A26;animation:nudge 1.6s infinite}
.next.done{background:var(--ok);color:#fff;border-color:#237A46}

.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.order{background:var(--paper);border-radius:14px;border:2px solid var(--line);padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.order.ready{border-color:var(--ok);box-shadow:0 0 0 3px rgba(46,158,91,.18)}
.order .p{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .p .em{font-size:20px}
.needs{display:flex;gap:4px}
.need{position:relative;width:36px;height:36px;border-radius:9px;background:var(--plank);display:grid;place-items:center;font-size:23px}
.need.have::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.order .rw{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.order .give{font-family:var(--disp);font-size:15px;border-radius:9px;padding:3px 12px;background:var(--ok);color:#fff}
.order .give[disabled]{background:var(--foam);color:var(--ink2);cursor:default}

.boardwrap{min-height:0;display:grid;place-items:center}
#play.scroll{height:auto;min-height:100%;grid-template-rows:auto auto auto auto auto}
#play.scroll .info{position:sticky;bottom:0;z-index:5}
.board{--cell:56px;display:grid;grid-template-columns:repeat(7,var(--cell));grid-auto-rows:var(--cell);gap:3px;padding:8px;
  background:var(--dock);border-radius:16px;box-shadow:inset 0 0 0 3px var(--dock2),0 6px 0 #4E301A;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{border-radius:9px;background:var(--plank);position:relative;display:grid;place-items:center}
.cell:nth-child(odd){background:var(--plank2)}
.cell.tgt{box-shadow:inset 0 0 0 3px var(--sun)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--sea)}
.tok{width:100%;height:100%;display:grid;place-items:center;font-size:calc(var(--cell)*.6);position:relative}
.tok .em{pointer-events:none}
.tok .lv{position:absolute;left:3px;bottom:2px;font-style:normal;font-family:var(--disp);font-size:calc(var(--cell)*.2);color:var(--dock2);line-height:1}
.tok.l5 .lv{color:var(--buoy)}
.tok.gen{background:radial-gradient(circle at 50% 45%,#fff 0,#FFF3D1 60%,transparent 62%)}
.tok.gen::after{content:"⚡";position:absolute;right:2px;top:1px;font-size:calc(var(--cell)*.22);font-family:var(--emoji)}
.tok.match::before{content:"✓";position:absolute;right:3px;top:3px;width:calc(var(--cell)*.26);height:calc(var(--cell)*.26);border-radius:50%;background:var(--ok);color:#fff;
  font-size:calc(var(--cell)*.17);display:grid;place-items:center;font-weight:700;font-family:var(--body)}
.tok.drag{opacity:.25}
.tok.pop{animation:pop .35s}
.tok.spawn{animation:spawn .3s}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:40;display:grid;place-items:center;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.info{background:var(--paper);border-radius:14px;border:2px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:10px;min-height:52px}
.info .big{font-size:34px}
.info .txt{flex:1;min-width:0}
.info .nm{font-family:var(--disp);font-size:17px}
.info .ds{font-size:13px;color:var(--ink2);line-height:1.35}
.chain{display:inline-flex;gap:2px;font-size:16px;vertical-align:middle;margin-left:4px}
.chain .em.me{outline:2px solid var(--sun);border-radius:4px}
.sell{font-family:var(--disp);font-size:14px;border-radius:10px;padding:6px 10px;background:var(--foam);border:2px solid var(--line);white-space:nowrap}

@media (min-aspect-ratio:1/1) and (min-width:820px){
  #play{grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;column-gap:16px}
  .topbar{grid-column:1 / -1}
  .scene{grid-column:1;grid-row:2}
  .orders{grid-column:1;grid-row:3;grid-template-columns:1fr;align-content:start}
  .order{flex-direction:row;justify-content:space-between;padding:8px 10px}
  .order .p{flex-direction:column;gap:0;width:64px;white-space:normal;text-align:center;font-size:11.5px}
  .order .p .em{font-size:28px}
  .boardwrap{grid-column:2;grid-row:2 / 4}
  .info{grid-column:2;grid-row:4}
  .scene .who{font-size:52px}
}

/* ---------- 모달 ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(11,75,87,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
.sheet{background:var(--paper);border-radius:22px;width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;box-sizing:border-box;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:up .25s}
.sheet h2{font-size:24px;color:var(--sea-deep)}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--foam);font-size:18px}
.talk{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.talk .f{font-size:48px;flex:none;width:56px;text-align:center}
.bubble{background:var(--foam);border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.5;position:relative;flex:1}
.bubble .n{display:block;font-family:var(--disp);font-size:14px;color:var(--sea)}
.bubble.gull{background:#FFF1CC}
.bubble.gull .n{color:#B7791F}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--disp);font-size:18px;padding:10px 18px;border-radius:14px;background:var(--sea);color:#fff;box-shadow:0 4px 0 var(--sea-deep)}
.btn.alt{background:var(--foam);color:var(--ink);box-shadow:0 4px 0 var(--foam2)}
.btn.warn{background:var(--buoy);box-shadow:0 4px 0 #B93A26}
.btn:active{transform:translateY(2px);box-shadow:none}
.qhead{display:flex;align-items:center;gap:8px;font-family:var(--disp);color:var(--buoy);font-size:15px}
.qq{font-size:19px;line-height:1.5;margin:8px 0 12px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;background:var(--foam);border:2px solid transparent;font-size:16px;line-height:1.4;display:flex;gap:10px}
.opt b{font-family:var(--disp);font-weight:400;color:var(--sea)}
.opt:hover{border-color:var(--sea)}
.opt.right{background:#DDF3E5;border-color:var(--ok)}
.opt.wrong{background:#FBE1DC;border-color:var(--buoy)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:15.5px;line-height:1.5}
.explain.good{background:#DDF3E5}
.explain.bad{background:#FBE1DC}
.explain strong{font-family:var(--disp);font-weight:400;font-size:18px;display:block}
.truth{border-radius:18px;border:3px solid var(--tint);padding:18px;background:var(--paper);position:relative}
.truth .rm{font-size:15px;color:var(--ink2)}
.truth .rm q{text-decoration:line-through;text-decoration-color:var(--buoy);text-decoration-thickness:2px}
.truth .stampbig{position:absolute;right:14px;top:10px;font-family:var(--disp);color:var(--buoy);border:3px solid var(--buoy);border-radius:10px;padding:2px 8px;transform:rotate(8deg);font-size:18px;background:var(--paper)}
.truth h3{font-size:24px;margin:12px 0 10px;color:var(--ink);padding-right:40px}
.truth ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.truth li{display:flex;gap:8px;font-size:16px;line-height:1.45}
.truth li::before{content:"✓";color:#fff;background:var(--tint);border-radius:50%;width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:13px;margin-top:1px}
.truth .foot{margin-top:12px;font-size:12.5px;color:var(--ink2)}
.howto{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;margin-top:14px;align-items:center;font-size:15.5px;line-height:1.4}
.howto .em{font-size:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--disp);font-weight:400;color:var(--sea-deep)}
.tw{overflow-x:auto}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.sw{width:54px;height:30px;border-radius:999px;background:var(--foam2);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:27px}
.note{font-size:13.5px;color:var(--ink2);line-height:1.5}
select{font:inherit;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;max-width:100%}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92%,460px)}
.tst{background:var(--sea-deep);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;line-height:1.4;animation:up .25s;text-align:center}
.float{position:fixed;z-index:45;pointer-events:none;font-family:var(--disp);font-size:22px;color:var(--buoy);animation:rise 1s forwards;text-shadow:0 2px 0 #fff}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes spawn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){
  .scene .who{font-size:34px}
  .scene .ttl h2{font-size:17px}
  .slot{width:32px;height:32px;font-size:19px}
  .next{font-size:14px;padding:6px 9px}
  .need{width:30px;height:30px;font-size:19px}
  .res{font-size:15px;padding:4px 8px 4px 6px}
  .ibtn{width:36px;height:36px}
  .qbtn{font-size:14px;padding:5px 9px}
}
</style>
</head><body>
<div id="app">
  <section id="map" class="screen">
    <div class="mapwrap">
      <header class="hero">
        <svg class="gull" viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="40" r="38" fill="#127C86"/>
          <path d="M12 58 Q24 52 36 58 T60 58 T76 56 L76 70 Q40 84 6 68Z" fill="#0B4B57"/>
          <ellipse cx="40" cy="44" rx="17" ry="13" fill="#FFFFFF"/>
          <circle cx="50" cy="31" r="10" fill="#FFFFFF"/>
          <path d="M58 31 L70 34 L58 36Z" fill="#FFC23D"/>
          <circle cx="52" cy="29" r="2.2" fill="#16353D"/>
          <path d="M24 40 Q34 28 44 42 Q34 46 24 40Z" fill="#B9C9CC"/>
          <path d="M34 56 L32 62 M44 56 L46 62" stroke="#FFC23D" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="grow">
          <h1>소문 항구 탐정단</h1>
          <p>합치고, 배달하고, 퀴즈를 풀어 마을에 퍼진 소문의 진실을 밝혀요. 구역마다 범교과 학습 주제 하나씩!</p>
        </div>
        <div class="hbtns">
          <button class="pill" id="btnGuide"><span class="em">🧑‍🏫</span>선생님 안내</button>
          <button class="pill" id="btnSet"><span class="em">⚙️</span>설정</button>
        </div>
      </header>
      <div class="sect"><h2>항구 마을 지도</h2><span>구역을 눌러 들어가요 · 수업 주제에 맞는 구역을 골라요</span></div>
      <div class="tiles" id="tiles"></div>
      <div class="sect"><h2>진실 카드 도감</h2><span id="cardCount"></span></div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button class="ibtn" id="btnHome" aria-label="지도로"><span class="em">🗺️</span></button>
      <span class="res" title="에너지"><span class="em">⚡</span><span id="eVal">50</span><small id="eTime"></small></span>
      <span class="res" title="동전"><span class="em">🪙</span><span id="cVal">0</span></span>
      <span class="res" title="이 구역의 별"><span class="em">⭐</span><span id="sVal">0</span></span>
      <span class="sp"></span>
      <button class="qbtn" id="btnQuiz"><span class="em">📚</span>퀴즈 충전</button>
      <button class="ibtn" id="btnHelp" aria-label="도움말"><span class="em">❓</span></button>
    </div>
    <div class="scene" id="scene"></div>
    <div class="orders" id="orders"></div>
    <div class="boardwrap" id="boardwrap"><div class="board" id="board"></div></div>
    <div class="info" id="info"></div>
  </section>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>

/* ===== 소문 항구 탐정단 : 머지 게임 엔진 ===== */
const COLS=7, ROWS=8, N=COLS*ROWS, MAX_E=50, REGEN=4000;
const STEP_COST=[3,5,6,8];
const STAR={1:0,2:1,3:2,4:3,5:5};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- 저장 ---------- */
let S;
function freshState(){return {v:1,energy:MAX_E,last:Date.now(),coins:20,sound:true,unlimited:false,tut:false,ch:{}}}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&o.v===1) return Object.assign(freshState(),o);}}catch(e){}
  return freshState();
}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)}
S=load();

function freshCh(ci){
  const b=Array(N).fill(null);
  b[22]={t:'g',c:0}; b[26]={t:'g',c:1};
  b[21]={t:'i',c:0,l:1}; b[15]={t:'i',c:0,l:1}; b[29]={t:'i',c:0,l:2};
  b[27]={t:'i',c:1,l:1}; b[19]={t:'i',c:1,l:1}; b[33]={t:'i',c:1,l:2};
  const c={board:b,step:0,stars:0,orders:[],done:false,intro:false};
  while(c.orders.length<3) c.orders.push(makeOrder(ci,c));
  return c;
}
function chState(ci){const id=CH[ci].id; if(!S.ch[id]) S.ch[id]=freshCh(ci); return S.ch[id]}

/* ---------- 소리 ---------- */
let AC=null;
function beep(f=520,d=.09,type='sine',v=.08,slide=0){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  spawn:()=>beep(660,.07,'triangle',.06,1.3),
  merge:l=>{beep(440+l*90,.1,'sine',.09,1.5);setTimeout(()=>beep(660+l*90,.12,'sine',.07,1.2),70)},
  deliver:()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.08),i*80))},
  ok:()=>{[587,740,880,1175].forEach((f,i)=>setTimeout(()=>beep(f,.13,'sine',.08),i*90))},
  no:()=>beep(220,.2,'square',.04,.7),
  tap:()=>beep(400,.04,'sine',.04)
};

/* ---------- 에너지 ---------- */
function tickEnergy(){
  const now=Date.now();
  if(S.energy>=MAX_E){S.last=now;return}
  const g=Math.floor((now-S.last)/REGEN);
  if(g>0){S.energy=Math.min(MAX_E,S.energy+g);S.last+=g*REGEN; if(S.energy>=MAX_E) S.last=now; save()}
}
function useEnergy(n){
  if(S.unlimited) return true;
  tickEnergy();
  if(S.energy<n) return false;
  if(S.energy>=MAX_E) S.last=Date.now();
  S.energy-=n; return true;
}
function addEnergy(n){S.energy=Math.min(MAX_E+30,S.energy+n)}

/* ---------- 주문 ---------- */
function makeOrder(ci,c){
  const ch=CH[ci];
  const people=[ch.npc,...ch.villagers];
  const pools=[[2,2,3],[2,3,3],[2,3,4],[3,3,4],[3,4,4]];
  const pool=pools[Math.min(c.step,4)];
  const two=Math.random()<.4;
  let needs=[];
  for(let k=0;k<(two?2:1);k++){
    let l=rnd(pool); if(two&&k===1) l=Math.max(2,l-1);
    needs.push({c:Math.floor(Math.random()*2),l});
  }
  const key=o=>o.needs.map(n=>n.c+'-'+n.l).sort().join('|');
  const o={p:people.indexOf(rnd(people)),needs};
  if(c.orders&&c.orders.some(x=>key(x)===key(o))) return makeOrder(ci,c);
  o.stars=needs.reduce((s,n)=>s+STAR[n.l],0);
  o.coins=needs.reduce((s,n)=>s+n.l*2,0);
  return o;
}
function boardCounts(b){const m={};b.forEach(x=>{if(x&&x.t==='i'){const k=x.c+'-'+x.l;m[k]=(m[k]||0)+1}});return m}
function orderStatus(o,cnt){
  const m=Object.assign({},cnt); const have=o.needs.map(n=>{const k=n.c+'-'+n.l; if(m[k]>0){m[k]--;return true}return false});
  return {have,ok:have.every(Boolean)};
}

/* ---------- 보드 ---------- */
const boardEl=$('#board');
function buildBoard(){
  if(boardEl.children.length===N) return;
  boardEl.innerHTML=Array.from({length:N},(_,i)=>`<div class="cell" data-i="${i}"></div>`).join('');
}
function itemOf(x){const ch=CH[CI]; return x.t==='g'?ch.chains[x.c].gen:ch.chains[x.c].items[x.l-1]}
function renderBoard(anim){
  const c=chState(CI); const cnt=boardCounts(c.board);
  // 주문에 쓰일 수 있는 아이템 표시
  const want={}; c.orders.forEach(o=>o.needs.forEach(n=>{want[n.c+'-'+n.l]=true}));
  [...boardEl.children].forEach((cell,i)=>{
    const x=c.board[i]; cell.classList.toggle('sel',i===sel);
    if(!x){cell.innerHTML='';return}
    const it=itemOf(x);
    const cls=['tok',x.t==='g'?'gen':'l'+x.l];
    if(x.t==='i'&&want[x.c+'-'+x.l]) cls.push('match');
    if(anim&&anim[i]) cls.push(anim[i]);
    cell.innerHTML=`<div class="${cls.join(' ')}"><span class="em">${it.e}</span>${x.t==='i'?`<i class="lv">${x.l}</i>`:''}</div>`;
  });
}
function nearestEmpty(from){
  const b=chState(CI).board; const fr=Math.floor(from/COLS), fc=from%COLS; let best=[],bd=1e9;
  for(let i=0;i<N;i++){ if(b[i]) continue; const r=Math.floor(i/COLS), cc=i%COLS; const d=Math.hypot(r-fr,cc-fc);
    if(d<bd-1e-6){bd=d;best=[i]} else if(Math.abs(d-bd)<1e-6) best.push(i)}
  return best.length?rnd(best):-1;
}
function spawn(gi){
  const c=chState(CI); const g=c.board[gi];
  const t=nearestEmpty(gi);
  if(t<0){toast('보드가 가득 찼어요! 같은 것끼리 합치거나 아래에서 팔아 보세요.');sfx.no();return}
  if(!useEnergy(1)){noEnergy();return}
  c.board[t]={t:'i',c:g.c,l:Math.random()<.18?2:1};
  sfx.spawn(); save(); renderBoard({[t]:'spawn'}); renderTop(); renderOrders();
}
function drop(a,b){
  const c=chState(CI); const A=c.board[a], B=c.board[b];
  if(a===b||!A) return;
  if(!B){c.board[b]=A;c.board[a]=null; sel=b}
  else if(A.t==='i'&&B.t==='i'&&A.c===B.c&&A.l===B.l){
    if(A.l>=5){c.board[a]=B;c.board[b]=A;toast('최고 단계예요! 주문에 쓰거나 팔 수 있어요.')}
    else{
      c.board[b]={t:'i',c:A.c,l:A.l+1}; c.board[a]=null; sel=b; sfx.merge(A.l);
      const it=itemOf(c.board[b]);
      if(A.l+1===5) toast(`최고 단계 완성! ${it.e} ${it.n}`);
      save(); renderBoard({[b]:'pop'}); renderOrders(); renderInfo(); return;
    }
  } else {c.board[b]=A;c.board[a]=B; sel=b}
  save(); renderBoard(); renderOrders(); renderInfo();
}

/* 드래그 & 탭 */
let P=null;
const ghost=$('#ghost');
function cellAt(x,y){const el=document.elementFromPoint(x,y); const cell=el&&el.closest&&el.closest('.cell'); return cell&&boardEl.contains(cell)?+cell.dataset.i:-1}
boardEl.addEventListener('pointerdown',e=>{
  if(CI<0||P) return;
  const cell=e.target.closest('.cell'); if(!cell) return;
  const i=+cell.dataset.i; const c=chState(CI);
  if(!c.board[i]){sel=-1;renderBoard();renderInfo();return}
  P={i,x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,tgt:-1};
  try{boardEl.setPointerCapture(e.pointerId)}catch(_){}
});
boardEl.addEventListener('pointermove',e=>{
  if(!P||e.pointerId!==P.id) return;
  const dx=e.clientX-P.x, dy=e.clientY-P.y;
  if(!P.drag&&Math.hypot(dx,dy)>8){
    P.drag=true; const x=chState(CI).board[P.i];
    const cs=parseFloat(getComputedStyle(boardEl).getPropertyValue('--cell'))||56;
    ghost.style.width=ghost.style.height=cs*1.1+'px'; ghost.style.fontSize=cs*.7+'px';
    ghost.innerHTML=`<span class="em">${itemOf(x).e}</span>`; ghost.hidden=false;
    const tok=boardEl.children[P.i].firstElementChild; if(tok) tok.classList.add('drag');
    sel=P.i;
  }
  if(P.drag){
    const cs=ghost.offsetWidth;
    ghost.style.transform=`translate(${e.clientX-cs/2}px,${e.clientY-cs/2}px)`;
    const t=cellAt(e.clientX,e.clientY);
    if(t!==P.tgt){ if(P.tgt>=0) boardEl.children[P.tgt].classList.remove('tgt'); if(t>=0&&t!==P.i) boardEl.children[t].classList.add('tgt'); P.tgt=t}
  }
});
function endPointer(e,cancel){
  if(!P||e.pointerId!==P.id) return;
  const p=P; P=null; ghost.hidden=true;
  if(p.tgt>=0) boardEl.children[p.tgt].classList.remove('tgt');
  if(cancel){renderBoard();return}

function deliver(k,btnEl){
  const ch=CH[CI], c=chState(CI), o=c.orders[k];
  if(!orderStatus(o,boardCounts(c.board)).ok) return;
  o.needs.forEach(n=>{
    let idx=-1;
    for(let i=0;i<N;i++){const x=c.board[i]; if(x&&x.t==='i'&&x.c===n.c&&x.l===n.l&&i!==sel){idx=i;break}}
    if(idx<0) idx=c.board.findIndex(x=>x&&x.t==='i'&&x.c===n.c&&x.l===n.l);
    if(idx>=0){c.board[idx]=null; if(idx===sel) sel=-1}
  });
  c.stars+=o.stars; S.coins+=o.coins;
  const people=[ch.npc,...ch.villagers]; const p=people[o.p]||ch.npc;
  if(btnEl){const r=btnEl.getBoundingClientRect(); floatText(`+⭐${o.stars}`,r.left+r.width/2,r.top)}

/* 보드 크기 맞추기 */
function fit(){
  if(CI<0) return;
  const play=$('#play'), w=$('#boardwrap'), pad=16+6, gap=3;
  play.classList.remove('scroll');
  const r=w.getBoundingClientRect();
  const avW=window.matchMedia('(min-aspect-ratio:1/1) and (min-width:820px)').matches?r.width:Math.min(r.width,play.clientWidth-32);
  const byW=Math.floor((avW-pad-gap*(COLS-1))/COLS), byH=Math.floor((r.height-pad-gap*(ROWS-1))/ROWS);
  let cs=Math.min(byW,byH);
  if(cs<44){play.classList.add('scroll'); cs=Math.min(byW,64)}
  cs=Math.max(34,Math.min(96,cs));
  boardEl.style.setProperty('--cell',cs+'px');
}

function startStory(ci,k){
  const ch=CH[ci], st=ch.steps[k]; let li=0;
  const showLine=()=>{
    if(li>=st.lines.length){runQuiz(st.quiz,{title:`단서 ${k+1} / 4 · ${st.title}`,onRight:()=>completeStep(ci,k),story:true});return}
    const [w,t]=st.lines[li];
    const sh=openModal(`<div class="qhead"><span class="em">🔍</span>단서 ${k+1} / 4 · ${esc(st.title)}</div>${talkHTML(ch,w,t)}
      <div class="row"><button class="btn" id="go">다음 ▶</button></div>`);
    sh.querySelector('#go').onclick=()=>{li++;showLine()};
  };
  showLine();
}
function runQuiz(qz,{title,onRight,onWrong,story}){
  const order=shuffle(qz.o.map((_,i)=>i)); const L='가나다라';
  const sh=openModal(`<div class="qhead"><span class="em">❓</span>${esc(title)}</div>
    <div class="qq">${esc(qz.q)}</div>
    <div class="opts">${order.map((oi,j)=>`<button class="opt" data-o="${oi}"><b>${L[j]}</b><span>${esc(qz.o[oi])}</span></button>`).join('')}</div>
    <div id="res"></div>`);
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const pick=+b.dataset.o, right=pick===qz.a;
    sh.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.o===qz.a&&right) x.classList.add('right')});
    b.classList.add(right?'right':'wrong');
    const res=sh.querySelector('#res');
    if(right){
      sfx.ok();
      res.innerHTML=`<div class="explain good"><strong>정답이에요!</strong>${esc(qz.x)}</div>
        <div class="row"><button class="btn" id="go">${story?'단서 얻기 🔍':'에너지 받기 ⚡'}</button></div>`;
      res.querySelector('#go').onclick=()=>{closeModal();onRight&&onRight()};
    }else{
      sfx.no();
      if(story){
        res.innerHTML=`<div class="explain bad"><strong>다시 생각해 볼까요?</strong>힌트: ${esc(qz.x)}</div>
          <div class="row"><button class="btn" id="go">다시 풀기</button></div>`;
        res.querySelector('#go').onclick=()=>runQuiz(qz,{title,onRight,onWrong,story});
      }else{
        sh.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.o===qz.a) x.classList.add('right')});
        res.innerHTML=`<div class="explain bad"><strong>아쉬워요! 정답을 확인해요.</strong>${esc(qz.x)}</div>
          <div class="row"><button class="btn" id="go">위로 에너지 받기 ⚡3</button></div>`;
        res.querySelector('#go').onclick=()=>{closeModal();onWrong&&onWrong()};
      }
    }
    res.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}
function completeStep(ci,k){

}

    sh.querySelector('#sw1').onclick=()=>{S.unlimited=!S.unlimited;save();draw();if(CI>=0)renderTop()};
    sh.querySelector('#sw2').onclick=()=>{S.sound=!S.sound;save();draw();sfx.tap()};
    const confirmBox=(msg,fn)=>{const cf=sh.querySelector('#cf');cf.innerHTML=`<div class="explain bad"><strong>${esc(msg)}</strong>되돌릴 수 없어요.<div class="row"><button class="btn alt" id="no">취소</button><button class="btn warn" id="yes">지우기</button></div></div>`;
      cf.querySelector('#no').onclick=()=>{cf.innerHTML=''}; cf.querySelector('#yes').onclick=fn};
    sh.querySelector('#r1').onclick=()=>{const i=+sh.querySelector('#selCh').value;confirmBox(`${CH[i].place} 기록을 지울까요?`,()=>{delete S.ch[CH[i].id];save();closeModal();if(CI===i)openChapter(i);else if(CI<0)renderMap();toast('초기화했어요.')})};
    sh.querySelector('#r2').onclick=()=>confirmBox('모든 구역의 기록을 지울까요?',()=>{const keep={sound:S.sound,unlimited:S.unlimited};S=Object.assign(freshState(),keep);save();closeModal();showMap();toast('전체 초기화했어요.')});
    sh.querySelector('#go').onclick=closeModal;
  };
  draw();
}

/* ---------- 알림 ---------- */
function toast(msg){const t=document.createElement('div');t.className='tst';t.textContent=msg;$('#toast').appendChild(t);
  const all=$('#toast').children; while(all.length>2) all[0].remove();
  setTimeout(()=>t.remove(),2600)}
function floatText(s,x,y){const f=document.createElement('div');f.className='float';f.textContent=s;f.style.left=(x-24)+'px';f.style.top=(y-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}

/* ---------- 연결 ---------- */
$('#btnHome').onclick=()=>{sfx.tap();showMap()};
$('#btnQuiz').onclick=()=>{sfx.tap();quizCharge()};
$('#btnHelp').onclick=()=>{sfx.tap();helpModal()};
$('#btnGuide').onclick=()=>guideModal();
$('#btnSet').onclick=()=>settingsModal();
setInterval(()=>{if(CI>=0) renderTop()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) save()});
showMap();
</script></body></html>
