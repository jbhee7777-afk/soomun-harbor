function runQuiz(qz,o){
  // o: {title, tag, retry, onRight, onWrong, rightLabel, wrongLabel, hint:{n,use}, closable}
  const order=shuffle(qz.o.map((_,i)=>i)); const L='가나다라마';
  const sh=openModal(`<div class="qhead"><span class="tag">${esc(o.tag||'퀴즈')}</span><span style="font-family:var(--disp);color:var(--ink2)">${esc(o.title||'')}</span>${ttsBtn(qz.q+'. '+order.map((oi,j)=>L[j]+', '+qz.o[oi]).join('. '))}</div>
    <div class="qq">${esc(qz.q)}</div>
    <div class="opts">${order.map((oi,j)=>`<button class="opt" data-o="${oi}"><b>${L[j]}</b><span>${esc(qz.o[oi])}</span></button>`).join('')}</div>
    ${o.hint&&o.hint.n>0&&qz.o.length>2?`<div class="row" style="justify-content:flex-start;margin-top:10px"><button class="cbtn butter" id="hintb" style="font-size:20px;padding:7px 14px">💡 힌트 쓰기 (${o.hint.n})</button></div>`:''}
    <div id="res"></div>`,{closable:o.closable!==false,onClose:o.onClose});
  const hb=sh.querySelector('#hintb');
  if(hb) hb.onclick=()=>{o.hint.use(); const wrong=shuffle([...sh.querySelectorAll('.opt')].filter(b=>+b.dataset.o!==qz.a&&!b.disabled)); if(wrong[0]){wrong[0].disabled=true;wrong[0].classList.add('gone')} hb.remove(); sfx.tap()};
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const pick=+b.dataset.o, right=pick===qz.a;
    if(CI>=0&&o.track!==false){ if(right){ if(o.review) wrongRemove(CI,qz) } else wrongAdd(CI,qz) }
    sh.querySelectorAll('.opt').forEach(x=>x.disabled=true); if(hb) hb.remove();
    b.classList.add(right?'right':'wrong');
    const res=sh.querySelector('#res');
    if(right){
      sfx.ok();
      res.innerHTML=`${o.starReward?`<div class="starwin"><span class="em">⭐</span>+${o.starReward}</div>`:''}<div class="explain good"><strong>딩동댕! 정답이에요</strong>${esc(qz.x||'')}</div><div class="row"><button class="cbtn mint" id="go">${esc(o.rightLabel||'좋아요!')}</button></div>`;
      res.querySelector('#go').onclick=()=>{closeModal();o.onRight&&o.onRight()};
    }else{
      sfx.no();
      if(o.retry){
        res.innerHTML=`<div class="explain bad"><strong>앗, 다시 생각해 볼까요?</strong>힌트: ${esc(qz.x||'')}</div><div class="row"><button class="cbtn" id="go">다시 풀기</button></div>`;
        res.querySelector('#go').onclick=()=>runQuiz(qz,o);
      }else{
        sh.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.o===qz.a)x.classList.add('right')});
        res.innerHTML=`<div class="explain bad"><strong>아쉬워요! 정답을 확인해요</strong>${esc(qz.x||'')}</div><div class="row"><button class="cbtn" id="go">${esc(o.wrongLabel||'계속하기')}</button></div>`;
        res.querySelector('#go').onclick=()=>{closeModal();o.onWrong&&o.onWrong()};
      }
    }
    res.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}
/* 구역마다 문제 은행 (퀴즈 + 미니게임 카드에서 자동으로 만든 문제) */
/* ---------- 학년 (S.grade: 1~6, 0이면 아직 고르지 않음) ----------
   문제에 g:[최소,최대] 학년을 붙이면 그 학년에게만 나와요. QBANK는 4번째 칸에 [최소,최대]를 적어요.
   학년에 맞는 문제가 너무 적으면(8개 미만) 구역 전체 문제에서 골라요. */
function curGrade(){const g=+S.grade;return g>=1&&g<=6?g:0}
function gradeFits(q,g){return !g||!Array.isArray(q.g)||(g>=q.g[0]&&g<=q.g[1])}
function setGrade(g){S.grade=g;save();if(SCREEN==='map')renderMap()}
function gradeModal(first,after){
  const sh=openModal(`<h2>${first?'반가워요, 탐정님!':'학년 바꾸기'}</h2>
    <p class="note">${first?'몇 학년인지 골라 주세요. 학년에 맞는 구역을 추천해 줄게요.':'지금까지 모은 별과 기록은 그대로 남아요.'}</p>
    <div class="gpick">${[1,2,3,4,5,6].map(g=>`<button class="gbig ${curGrade()===g?'on':''}" data-g="${g}"><b>${g}</b><span>학년</span><small>${g<3?'저학년':g<5?'중학년':'고학년'}</small></button>`).join('')}</div>`,
    {closable:!first,onClose:()=>{after&&after()}});
  sh.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{setGrade(+b.dataset.g);sfx.ok();closeModal();toast(`${b.dataset.g}학년 탐정님, 환영해요!`)});
}
const POOL={}, GPOOL={};
function poolOf(ci){
  const all=poolAll(ci), g=curGrade(), k=ci+'|'+g;
  if(GPOOL[k]) return GPOOL[k];
  const f=all.filter(q=>gradeFits(q,g));
  return GPOOL[k]=(f.length>=8&&f.length<all.length)?f:all;
}
function poolKey(ci){return poolOf(ci)===poolAll(ci)?'all':'g'+curGrade()}
function poolAll(ci){
  if(POOL[ci]) return POOL[ci];
  const ch=CH[ci], qs=[];
  ch.steps.forEach(s=>{if(s.quiz)qs.push(s.quiz)}); ch.extra.forEach(q=>qs.push(q));
  (QBANK[ch.id]||[]).forEach(([q,o,x,g])=>qs.push(g?{q,o,a:0,x,g}:{q,o,a:0,x}));
  (GAMES[ch.id]||[]).forEach(g=>{
    if(g.type==='ox') g.cards.forEach(c=>qs.push({q:`⭕❌ “${c.t}”`,o:['⭕ 맞아요','❌ 틀려요'],a:c.a?0:1,x:g.x}));
    if(g.type==='sort') g.cards.forEach(c=>qs.push({q:`“${c.t}” 은(는) 어디에 들어갈까요?`,o:g.bins.map(b=>b.e+' '+b.n),a:c.b,x:g.x}));
    if(g.type==='match') g.pairs.forEach(([l,r],i)=>{const others=shuffle(g.pairs.filter((_,j)=>j!==i).map(p=>p[1])).slice(0,2);qs.push({q:`“${l}”와(과) 짝이 되는 것은?`,o:[r,...others],a:0,x:g.x})});
    if(g.type==='order'){const others=shuffle(g.items.slice(1)).slice(0,2);qs.push({q:`「${g.name}」 가장 먼저 할 일은?`,o:[g.items[0],...others],a:0,x:g.x})}
  });
  const seen=new Set(); return POOL[ci]=qs.filter(q=>!seen.has(q.q)&&seen.add(q.q));
}
/* 모든 놀이가 함께 쓰는 문제 덱: 한 바퀴 다 풀기 전에는 같은 문제가 다시 나오지 않아요 (저장됨) */
function drawQ(ci){
  const pool=poolOf(ci), c=chState(ci), key=poolKey(ci);
  if((c.deckK||'all')!==key){c.deck=[];c.recent=[]} /* 학년이 바뀌어 문제 묶음이 달라지면 덱을 새로 섞어요 */
  c.deckK=key;
  if(!Array.isArray(c.deck)||!c.deck.length||c.deck.some(i=>i>=pool.length)){
    let d=shuffle(pool.map((_,i)=>i)); const r=c.recent||[];
    d=d.filter(i=>!r.includes(i)).concat(d.filter(i=>r.includes(i)).reverse()); /* 방금 푼 문제는 새 덱의 맨 뒤로 */
    c.deck=d.reverse(); /* pop()으로 앞에서부터 꺼냄 → 최근 문제는 가장 나중에 */
  }
  const i=c.deck.pop(); c.recent=[i,...(c.recent||[])].slice(0,12); save();
  return pool[i];
}

/* ---------- 미니게임 ---------- */
function runGame(g,o){
  // o: {title, doneLabel, onDone(mistakes)}
  let miss=0;
  const head=`<div class="qhead"><span class="tag" style="background:var(--mint2)">🎮 미니게임</span><span style="font-family:var(--disp);font-size:24px">${esc(g.name)}</span><span class="gdots" id="gd"></span></div><div class="gprompt">${esc(g.prompt)}</div>`;
  const dots=(n,k)=>{const d=modal.querySelector('#gd'); if(d) d.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<k?'on':''}"></i>`).join('')};
  const finish=()=>{
    const st=Math.max(1,3-miss);
    sfx.ok(); confetti(26);
    const sh=openModal(`${head.replace(/<span class="gdots".*?<\/span>/,'')}<div class="result"><h2>미션 성공!</h2><div class="stars">${[0,1,2].map(i=>`<span class="em ${i<st?'':'off'}">⭐</span>`).join('')}</div>
      <div class="explain good" style="text-align:left">${esc(g.x||'')}</div></div><div class="row"><button class="cbtn mint" id="go">${esc(o.doneLabel||'좋아요!')}</button></div>`,{closable:false});
    sh.querySelector('#go').onclick=()=>{closeModal();o.onDone&&o.onDone(miss)};
  };
  if(g.type==='order'){
    let k=0; const opts=shuffle(g.items.map((t,i)=>i));
    const sh=openModal(`${head}<div class="oslots">${g.items.map((_,i)=>`<div class="oslot" data-s="${i}"><b>${i+1}</b><span></span></div>`).join('')}</div>
      <div class="gbtns">${opts.map(i=>`<button class="gbtn" data-i="${i}">${esc(g.items[i])}</button>`).join('')}</div>`);
    dots(g.items.length,0);
    sh.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===k){const s=sh.querySelector(`.oslot[data-s="${k}"]`);s.classList.add('f');s.querySelector('span').textContent=g.items[i];b.remove();k++;sfx.place();dots(g.items.length,k);if(k===g.items.length)setTimeout(finish,500)}
      else{miss++;sfx.no();b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');toast('순서를 다시 생각해 봐요!')}
    });
  }
  if(g.type==='sort'){
    let k=0; const cards=shuffle(g.cards);
    const draw=()=>{
      const sh=openModal(`${head}<div class="scard">${esc(cards[k].t)}</div><div class="bins" style="${g.bins.length>2?'':'grid-template-columns:1fr 1fr'}">${g.bins.map((b,i)=>`<button class="bin" data-b="${i}"><span class="em">${b.e}</span>${esc(b.n)}</button>`).join('')}</div>`);
      dots(cards.length,k);
      sh.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{
        if(+b.dataset.b===cards[k].b){b.classList.add('good');sfx.place();k++;floatText('+1',b.getBoundingClientRect().left+40,b.getBoundingClientRect().top);if(k===cards.length)setTimeout(finish,350);else setTimeout(draw,280)}
        else{miss++;sfx.no();b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad')}
      });
    };
    draw();
  }
  if(g.type==='match'){
    let sel=null, done=0; const L=g.pairs.map((p,i)=>i), R=shuffle(g.pairs.map((p,i)=>i));
    const sh=openModal(`${head}<div class="mcols"><div class="gbtns" id="ml">${L.map(i=>`<button class="gbtn" data-l="${i}">${esc(g.pairs[i][0])}</button>`).join('')}</div>
      <div class="gbtns" id="mr">${R.map(i=>`<button class="gbtn" data-r="${i}">${esc(g.pairs[i][1])}</button>`).join('')}</div></div>`);
    dots(g.pairs.length,0);
    sh.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;sh.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l;sfx.tap()});
    sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('ok'))return;
      if(sel==null){toast('왼쪽에서 먼저 하나 골라요!');return}
      const lb=sh.querySelector(`[data-l="${sel}"]`);
      if(+b.dataset.r===sel){lb.classList.remove('sel');lb.classList.add('ok');b.classList.add('ok');lb.disabled=b.disabled=true;sel=null;done++;sfx.place();dots(g.pairs.length,done);if(done===g.pairs.length)setTimeout(finish,450)}
      else{miss++;sfx.no();b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad')}
    });
  }
  if(g.type==='ox'){
    let k=0; const cards=shuffle(g.cards);
    const draw=()=>{
      const c=cards[k];
      const sh=openModal(`${head}<div class="scard">${esc(c.t)}</div><div class="oxbtns"><button data-a="1" aria-label="맞아요">⭕</button><button data-a="0" aria-label="틀려요">❌</button></div><div id="res"></div>`);
      dots(cards.length,k);
      sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
        const right=(+b.dataset.a===1)===c.a; sh.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);
        if(right){sfx.place();b.style.background='var(--mintL)'}else{miss++;sfx.no();b.style.background='var(--pinkL)'}
        const res=sh.querySelector('#res');
        res.innerHTML=`<div class="explain ${right?'good':'bad'}"><strong>${right?'정답!':'앗, 정답은 '+(c.a?'⭕':'❌')+'예요'}</strong></div><div class="row"><button class="cbtn ${right?'mint':''}" id="go">${k+1<cards.length?'다음 ▶':'결과 보기'}</button></div>`;
        res.querySelector('#go').onclick=()=>{k++;if(k<cards.length)draw();else finish()};
      });
    };
    draw();
  }
  if(g.type==='budget'){
    const on=new Set();
    const sh=openModal(`${head}<div class="shop">${g.items.map((it,i)=>`<button class="item" data-i="${i}"><span class="em">${it.e}</span><b>${esc(it.n)}</b><small>${it.p.toLocaleString()}원</small></button>`).join('')}</div>
      <div class="wallet"><span>👛 가진 돈 ${g.budget.toLocaleString()}원</span><span id="tot">장바구니 0원</span></div>
      <div id="res"></div><div class="row"><button class="cbtn mint" id="pay">계산하기</button></div>`);
    const upd=()=>{const t=[...on].reduce((s,i)=>s+g.items[i].p,0);sh.querySelector('#tot').textContent=`장바구니 ${t.toLocaleString()}원`;return t};
    sh.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on.has(i)?on.delete(i):on.add(i);b.classList.toggle('on');sfx.tap();upd()});
    sh.querySelector('#pay').onclick=()=>{
      const t=upd(); const res=sh.querySelector('#res'); let msg='';
      if(t>g.budget) msg='돈이 모자라요! 가진 돈보다 많이 담았어요.';
      else if(g.items.some((it,i)=>it.need&&!on.has(i))) msg='소풍에 꼭 필요한 물건이 빠졌어요.';
      else if(g.items.some((it,i)=>!it.need&&on.has(i))) msg='갖고 싶은 물건이 들어 있어요. 꼭 필요한 것만 사 볼까요?';
      if(msg){miss++;sfx.no();res.innerHTML=`<div class="explain bad"><strong>다시 담아 볼까요?</strong>${msg}</div>`}
      else{res.innerHTML='';toast(`${(g.budget-t).toLocaleString()}원 저금 성공!`);finish()}
    };
  }
}

/* ---------- 이야기 ---------- */
function startStory(ci,k){
  const ch=CH[ci], st=ch.steps[k]; let li=0;
  const next=()=>{
    if(li>=st.lines.length){
      if(st.game) runGame(st.game,{doneLabel:'단서 얻기',onDone:()=>completeStep(ci,k)});
      else runQuiz(st.quiz,{tag:`단서 ${k+1}/4`,title:st.title,retry:true,rightLabel:'단서 얻기',onRight:()=>completeStep(ci,k)});
      return;
    }
    const [w,t]=st.lines[li];
    const sh=openModal(`<div class="qhead"><span class="tag">🔍 단서 ${k+1} / 4</span><span style="font-family:var(--disp)">${esc(st.title)}</span></div>${talkHTML(ch,w,t)}
      <div class="row"><button class="cbtn" id="go">다음 ▶</button></div>`);
    sh.querySelector('#go').onclick=()=>{li++;next()};
  };
  next();
}
function completeStep(ci,k){
  const c=chState(ci); if(c.step!==k) return;
  c.stars-=STEP_COST[k]; c.step++; c._pop=true; if(c.step>=4) c.done=true;
  save(); confetti(40); refresh();
  if(c.done) setTimeout(()=>showTruth(ci,true),400);
  else toast(`🔍 단서 ${c.step}/4 획득! ${CH[ci].steps[k].deco} ${CH[ci].steps[k].title}`);
}
function addStars(n,x,y){const c=chState(CI);c.stars+=n;save();if(x!=null)floatText(`+⭐${n}`,x,y);$$('.sVal').forEach(e=>e.textContent=c.stars)}

/* ---------- 따라 하기 안내 (코치) ---------- */
const coachEl=$('#coach'); let CO=null;
function coachStart(steps,onDone){coachEnd(true);CO={steps,i:0,onDone,cnt:0};coachEl.hidden=false;coachStep();CO.t=setInterval(coachPos,250)}
function coachEnd(silent){if(!CO)return;clearInterval(CO.t);const f=CO.onDone;CO=null;coachEl.hidden=true;coachEl.innerHTML='';if(!silent&&f)f()}
function coachEmit(ev){if(!CO)return;const st=CO.steps[CO.i];if(st.wait!==ev)return;CO.cnt++;if(CO.cnt>=(st.count||1)){CO.i++;CO.cnt=0;if(CO.i>=CO.steps.length){const f=CO.onDone;CO.onDone=null;coachEnd();f&&f()}else setTimeout(coachStep,st.delay||350)}}
function coachStep(){
  if(!CO) return; const st=CO.steps[CO.i]; if(st.enter) st.enter();
  const ch=CI>=0?CH[CI]:CH[0];
  coachEl.innerHTML=`<div class="spot"></div><div class="ring"></div><div class="hand"></div>
    <div class="cbox">${faceHTML(ch,st.who||'gull')}<div class="bubble ${st.who==='npc'?'':'gull'}"><b class="n">${st.who==='npc'?esc(ch.npc.name):GULL.name}</b>${esc(st.text)}
    <div class="row" style="justify-content:space-between;align-items:center"><button class="skip" id="cSkip">안내 건너뛰기</button>${st.wait==='next'?'<button class="cbtn butter" id="cNext" style="font-size:21px;padding:7px 16px">알겠어! ▶</button>':''}</div></div></div>`;
  coachEl.querySelector('#cSkip').onclick=()=>coachEnd(false);
  const nb=coachEl.querySelector('#cNext'); if(nb) nb.onclick=()=>{sfx.tap();CO.cnt=0;coachEmit('next')};
  coachPos();
}
function coachPos(){
  if(!CO) return; const st=CO.steps[CO.i]; if(!st) return;
  const spot=coachEl.querySelector('.spot'), ring=coachEl.querySelector('.ring'), hand=coachEl.querySelector('.hand'), box=coachEl.querySelector('.cbox');
  if(!spot) return;
  let el=st.target?st.target():null, pair=st.drag?st.drag():null;
  let r=null;
  if(pair&&pair[0]&&pair[1]){const a=pair[0].getBoundingClientRect(),b=pair[1].getBoundingClientRect();r={left:Math.min(a.left,b.left),top:Math.min(a.top,b.top),right:Math.max(a.right,b.right),bottom:Math.max(a.bottom,b.bottom)}}
  else if(el){r=el.getBoundingClientRect()}
  if(r){const p=8;Object.assign(spot.style,{left:r.left-p+'px',top:r.top-p+'px',width:(r.right-r.left)+2*p+'px',height:(r.bottom-r.top)+2*p+'px'});spot.classList.remove('none');
    Object.assign(ring.style,{left:r.left-p+'px',top:r.top-p+'px',width:(r.right-r.left)+2*p+'px',height:(r.bottom-r.top)+2*p+'px',display:'block'})}
  else{spot.classList.add('none');spot.removeAttribute('style');ring.style.display='none'}
  hand.className='hand'; hand.textContent='';
  if(pair&&pair[0]&&pair[1]){const a=pair[0].getBoundingClientRect(),b=pair[1].getBoundingClientRect();hand.textContent='👆';hand.classList.add('drag');
    hand.style.left=a.left+a.width/2-14+'px';hand.style.top=a.top+a.height/2-4+'px';hand.style.setProperty('--dx',(b.left-a.left)+'px');hand.style.setProperty('--dy',(b.top-a.top)+'px')}
  else if(el&&st.hand!==false&&st.wait!=='next'){const a=el.getBoundingClientRect();hand.textContent='👆';hand.classList.add('tap');hand.style.left=a.left+a.width/2-14+'px';hand.style.top=a.top+a.height/2+'px'}
  const H=window.innerHeight; const mid=r?(r.top+r.bottom)/2:H;
  const below=!r||mid<H*.5;
  box.style.top=below?'':'calc(12px + env(safe-area-inset-top,0px))'; box.style.bottom=below?'calc(14px + env(safe-area-inset-bottom,0px))':'';
  if(r&&!below&&r.top<box.offsetHeight+30){box.style.top='';box.style.bottom='calc(14px + env(safe-area-inset-bottom,0px))'}
}

/* ---------- 알림 · 효과 ---------- */
function toast(msg){const t=document.createElement('div');t.className='tst';t.textContent=msg;$('#toast').appendChild(t);const all=$('#toast').children;while(all.length>2)all[0].remove();setTimeout(()=>t.remove(),2600)}
function floatText(s,x,y){const f=document.createElement('div');f.className='float';f.textContent=s;f.style.left=(x-24)+'px';f.style.top=(y-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
function comboText(s,x,y){const f=document.createElement('div');f.className='combo';f.textContent=s;f.style.left=(x-60)+'px';f.style.top=(y-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
function fxBurst(x,y,cols,n=10,size=60){
  const add=(cls,st,ms)=>{const e=document.createElement('div');e.className=cls;e.style.cssText=st;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)};
  add('fxr',`left:${x}px;top:${y}px;--s:${size}px;border-color:${cols[0]}`,520);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=size*(.5+Math.random()*.6);
    add('fxp',`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;background:${cols[i%cols.length]}`,700)}
}
function confetti(n=40){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FF8FB1','#FFD66B','#7FDDB8','#9FD8FF','#BBA9FF','#FF8C74'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=rnd(cols);
    d.style.animationDuration=(1.6+Math.random()*1.4)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}
}

/* ---------- 🔊 읽어주기 (브라우저 내장 음성, 한국어 음성이 있을 때만) ---------- */
const TTS={ok:false,voice:null,btn:null};
function ttsInit(){
  try{
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined') return;
    const pick=()=>{const v=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang||''));
      if(v){TTS.ok=true;TTS.voice=v;document.body.classList.add('tts-on')}};
    pick(); if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged',pick);
  }catch(e){}
}
function ttsBtn(text,cls=''){return `<button class="tts ${cls}" type="button" data-say="${esc(text)}" aria-label="읽어주기" title="읽어주기"><span class="em">🔊</span></button>`}
function ttsStop(){try{if(TTS.ok&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel()}catch(e){} if(TTS.btn){TTS.btn.classList.remove('on');TTS.btn=null}}
document.addEventListener('click',e=>{
  const b=e.target.closest('.tts'); if(!b||!TTS.ok) return;
  e.stopPropagation();
  if(TTS.btn===b){ttsStop();return}
  ttsStop();
  const u=new SpeechSynthesisUtterance(b.dataset.say); u.lang='ko-KR'; u.voice=TTS.voice; u.rate=.9;
  u.onend=u.onerror=()=>{if(TTS.btn===b){b.classList.remove('on');TTS.btn=null}};
  TTS.btn=b; b.classList.add('on'); speechSynthesis.speak(u);
},true);

/* ---------- 🔁 헷갈린 문제 (구역별 오답 기록) ---------- */
function qid(q){let h=5381;const s=q.q;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'q'+(h>>>0).toString(36)}
function wrongAdd(ci,q){const c=chState(ci);if(!Array.isArray(c.wrong))c.wrong=[];const id=qid(q);if(!c.wrong.includes(id)){c.wrong.push(id);save()}}
function wrongRemove(ci,q){const c=chState(ci);if(!Array.isArray(c.wrong))return;const id=qid(q);const n=c.wrong.length;c.wrong=c.wrong.filter(x=>x!==id);if(c.wrong.length!==n)save()}
function reviewWrong(){
  const ci=CI, c=chState(ci);
  const ids=new Set(c.wrong||[]);
  const list=shuffle(poolAll(ci).filter(q=>ids.has(qid(q))));
  /* 문제 은행에서 사라진 오래된 기록은 정리 */
  const alive=new Set(poolAll(ci).map(qid)); c.wrong=(c.wrong||[]).filter(x=>alive.has(x)); save();
  if(!list.length){renderHub();toast('다시 풀 문제가 없어요!');return}
  let i=0, got=0;
  const next=()=>{
    if(CI!==ci) return;
    if(i>=list.length){
      renderHub();
      const left=(chState(ci).wrong||[]).length;
      const sh=openModal(`<h2>${got?'🎉 다시 풀기 끝!':'다시 풀기 끝!'}</h2>
        <div class="bigmsg">${got?`<b>${got}문제</b>를 이번엔 맞혔어요! <span class="em">⭐</span>+${got}`:'괜찮아요! 틀리면서 배우는 거예요.'}</div>
        <p class="note" style="text-align:center">${left?`아직 헷갈리는 문제 ${left}개가 남아 있어요. 다음에 또 도전해요!`:'헷갈린 문제를 모두 해결했어요!'}</p>
        <div class="row"><button class="cbtn mint" id="go">좋아요!</button></div>`);
      sh.querySelector('#go').onclick=closeModal;
      if(got) confetti(30);
      return;
    }
    const q=list[i++];
    runQuiz(q,{tag:`🔁 다시 풀기 ${i}/${list.length}`,title:'이번엔 맞힐 수 있어요!',review:true,starReward:1,
      rightLabel:i<list.length?'다음 문제':'끝내기',wrongLabel:i<list.length?'다음 문제':'끝내기',
      onRight:()=>{got++;addStars(1);next()},onWrong:next,onClose:()=>{if(SCREEN==='hub')renderHub()}});
  };
  next();
}

function lessonLeft(){

  const ms=Math.max(0,L.start+L.dur*60000-Date.now()); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000);

/* 입력: 밀기(스와이프·마우스 끌기) 또는 두 칸을 차례로 톡톡 */
let MP=null;
mboardEl.addEventListener('pointerdown',e=>{

async function trySwap(r,c,r2,c2){
  if(!M||M.busy||M.over||M.moves<=0) return;
  const my=M; M.busy=true; mIdle(true);
  const a=M.g[r][c], b=M.g[r2][c2];
  swapCells(r,c,r2,c2); placeAll(); sfx.tap(); await wait(200);
  if(M!==my) return;

    await gravity(); if(M!==my) return;

  }

  if(!found.cells.size){swapCells(r,c,r2,c2);placeAll();sfx.no();a.el.classList.add('nope');b.el.classList.add('nope');await wait(260);a.el.classList.remove('nope');b.el.classList.remove('nope');M.busy=false;mIdle();return}

/* 같은 그림 3개 이상 가로·세로 줄을 찾고, 서로 겹치는 줄(ㄱ·ㅗ·十 모양)은 한 묶음으로 모아요 */
function findMatches(){
  const runs=[], cells=new Set();
  const T=(r,c)=>{const t=M.g[r][c];return t&&t.sp!=='rainbow'?t.t:-1};
  for(let r=0;r<MR;r++){let s=0;for(let c=1;c<=MC;c++){if(c<MC&&T(r,c)===T(r,s)&&T(r,s)>=0)continue;if(c-s>=3&&T(r,s)>=0){const run=[];for(let k=s;k<c;k++)run.push(M.g[r][k]);runs.push({dir:'h',cells:run})}s=c}}
  for(let c=0;c<MC;c++){let s=0;for(let r=1;r<=MR;r++){if(r<MR&&T(r,c)===T(s,c)&&T(s,c)>=0)continue;if(r-s>=3&&T(s,c)>=0){const run=[];for(let k=s;k<r;k++)run.push(M.g[k][c]);runs.push({dir:'v',cells:run})}s=r}}

  for(const run of runs){

/* 묶음 모양으로 어떤 특수 블록을 만들지, 어디에 만들지 정해요 */
function specialFor(g){
  const long=g.runs.reduce((a,r)=>r.cells.length>a.cells.length?r:a,g.runs[0]);
  let sp=null, cross=null;
  const hs=g.runs.filter(r=>r.dir==='h'), vs=g.runs.filter(r=>r.dir==='v');
  if(long.cells.length>=5) sp='rainbow';
  else if(hs.length&&vs.length){sp='bomb';cross=hs[0].cells.find(t=>vs.some(v=>v.cells.includes(t)))}
  else if(long.cells.length===4) sp=long.dir==='h'?'lineH':'lineV';
  if(!sp) return null;
  const free=t=>t&&!t.sp;
  let at=(M.swapped||[]).find(t=>g.set.has(t)&&free(t));
  if(!at&&free(cross)) at=cross;
  if(!at){const mid=long.cells[Math.floor(long.cells.length/2)]; at=free(mid)?mid:[...g.set].find(free)}

async function resolve(cascade,found){
  const my=M;

    M.keep=new Set(keep.keys());
    const kill=new Set([...found.cells].filter(t=>!keep.has(t)));
    if(cascade>1){M.maxCombo=Math.max(M.maxCombo,cascade);mCombo(cascade)}
    await popTiles(kill,cascade); if(M!==my) return;
    for(const [t,sp] of keep){t.sp=sp;t._used=false;drawTile(t);t.el.classList.add('made');M.score+=sp==='rainbow'?200:sp==='bomb'?120:80;M.made++;mSay(MSP[sp]+'!',t)}
    if(keep.size) sfx.ok();
    M.keep=null; M.swapped=null;
    await gravity(); if(M!==my) return;
    renderMatchTop();
    found=findMatches();

/* 특수 블록 효과 범위 */
function effectCells(t,[r,c]){
  const out=[], at=(R,C)=>{if(R>=0&&R<MR&&C>=0&&C<MC&&M.g[R][C])out.push(M.g[R][C])};
  if(t.sp==='lineH'){for(let k=0;k<MC;k++)at(r,k);mBeam('h',r)}
  else if(t.sp==='lineV'){for(let k=0;k<MR;k++)at(k,c);mBeam('v',c)}
  else if(t.sp==='bomb'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)at(r+dr,c+dc);mShock(r,c,1)}
  else if(t.sp==='rainbow'){const cnt={};for(const row of M.g)for(const x of row)if(x&&x.sp!=='rainbow')cnt[x.t]=(cnt[x.t]||0)+1;
    const k=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]; for(const row of M.g)for(const x of row)if(x&&x.t===+k&&x.sp!=='rainbow')out.push(x); mShock(r,c,2)}

}
/* 터뜨리기: 특수 블록이 끼어 있으면 효과가 번져요(연쇄 폭발) */
async function popTiles(set,cascade){
  const q=[...set];
  while(q.length){const t=q.pop(); if(!t.sp||t._used) continue; t._used=true; const p=posOf(t); if(!p) continue;
    M.score+=50*cascade;

  if(!set.size) return;
  let sx=0,sy=0,n=0, parts=0;

    t.el.classList.remove('sel','hint'); t.el.classList.add('pang');
    if(parts<70){mBurst(t);parts+=3}}
  const pts=set.size*20*cascade; M.score+=pts;

/* 특수 블록 두 개를 바꾸거나 무지개 진주를 쓰면 합체 효과! */
async function comboSpecial(a,b){
  const kill=new Set([a,b]); const [r0,c0]=posOf(a);
  const rb=a.sp==='rainbow'?a:b.sp==='rainbow'?b:null;
  const all=()=>[].concat(...M.g).filter(Boolean);
  if(rb){
    const o=rb===a?b:a; rb._used=true;
    if(o.sp==='rainbow'){o._used=true;all().forEach(t=>kill.add(t));mSay('진주 대폭발!',rb);mShock(r0,c0,4);confetti(40)}
    else{
      const same=all().filter(t=>t.t===o.t&&t.sp!=='rainbow');
      if(o.sp){same.forEach(t=>{if(!t.sp){t.sp=o.sp==='bomb'?'bomb':(Math.random()<.5?'lineH':'lineV');drawTile(t);t.el.classList.add('made')}});sfx.ok();await wait(450)}
      else o._used=true;
      same.forEach(t=>kill.add(t)); mSay(MSP.rainbow+'!',rb); mShock(...posOf(rb),2); confetti(20);
    }
  }else{
    a._used=b._used=true; const bombs=(a.sp==='bomb')+(b.sp==='bomb');
    const add=(R,C)=>{if(R>=0&&R<MR&&C>=0&&C<MC&&M.g[R][C])kill.add(M.g[R][C])};
    if(bombs===2){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)add(r0+dr,c0+dc);mShock(r0,c0,2.4);mSay('큰 소용돌이!',a)}
    else if(bombs===1){for(let d=-1;d<=1;d++){for(let k=0;k<MC;k++)add(r0+d,k);for(let k=0;k<MR;k++)add(k,c0+d);mBeam('h',r0+d);mBeam('v',c0+d)}mSay('큰 등대 빛!',a)}
    else{for(let k=0;k<MC;k++)add(r0,k);for(let k=0;k<MR;k++)add(k,c0);mBeam('h',r0);mBeam('v',c0);mSay('십자 등대 빛!',a)}
  }
  M.maxCombo=Math.max(M.maxCombo,1);
  await popTiles(kill,2);
}
async function gravity(){
  for(let c=0;c<MC;c++){
    let w=MR-1;
    for(let r=MR-1;r>=0;r--){if(M.g[r][c]){const t=M.g[r][c];M.g[r][c]=null;M.g[w][c]=t;w--}}
    const top=w+1; for(let r=w;r>=0;r--) M.g[r][c]=mkTile(Math.floor(Math.random()*MTYPES),r,c,r-top-1);
  }
  void mboardEl.offsetWidth;
  const mx=placeAll(); await wait(mx*1000+40);
}

function hasMove(){
  for(let r=0;r<MR;r++)for(let c=0;c<MC;c++){
    const t=M.g[r][c]; if(t&&t.sp==='rainbow') return true;
    for(const [dr,dc] of [[0,1],[1,0]]){const R=r+dr,C=c+dc;if(R>=MR||C>=MC)continue;
      if(t&&t.sp&&M.g[R][C]&&M.g[R][C].sp) return true;
      swapCells(r,c,R,C);const ok=findMatches().cells.size>0;swapCells(r,c,R,C);if(ok)return true}
  }
  return false;
}

function moveBP(x,y){
  const lift=Math.max(50,BP.bc*1.3);

  const ok=fits(BP.p,row,col);

function BP_PITCH(){return (parseFloat(getComputedStyle(bboardEl).getPropertyValue('--bc'))||40)+3}
function fullLines(g){
  const rows=[],cols=[];
  for(let r=0;r<BN;r++){let f=true;for(let c=0;c<BN;c++)if(!g[r*BN+c]){f=false;break}if(f)rows.push(r)}
  for(let c=0;c<BN;c++){let f=true;for(let r=0;r<BN;r++)if(!g[r*BN+c]){f=false;break}if(f)cols.push(c)}
  const cells=new Set();rows.forEach(r=>{for(let c=0;c<BN;c++)cells.add(r*BN+c)});cols.forEach(c=>{for(let r=0;r<BN;r++)cells.add(r*BN+c)});
  return {n:rows.length+cols.length,cells:[...cells],rows,cols};
}
function placePiece(k,r,c){

  const L=fullLines(B.g);
  renderBlock();
  p.s.forEach(([a,b])=>bboardEl.children[(r+a)*BN+c+b].classList.add('put'));
  if(L.n){
    B.streak++; const gain=10*L.n*L.n+(B.streak>1?B.streak*5:0); B.score+=gain; B.lines+=L.n;

/* ---------- 물리 ---------- */
function pdPhysics(){
  const bs=PD.b, merges=[];
  for(const o of bs){o.vy+=.32;o.vx*=.996;o.vy*=.998;o.x+=o.vx;o.y+=o.vy;o.a+=o.vx/o.r;o.age++}
  for(let it=0;it<6;it++){
    for(let i=0;i<bs.length;i++){const a=bs[i];if(a.dead)continue;
      for(let j=i+1;j<bs.length;j++){const b=bs[j];if(b.dead)continue;
        const dx=b.x-a.x, dy=b.y-a.y, min=a.r+b.r, d2=dx*dx+dy*dy; if(d2>=min*min) continue;
        const d=Math.sqrt(d2)||.01, nx=dx/d, ny=dy/d;
        if(a.l===b.l&&!a.m&&!b.m&&(a.age>2||b.age>2)){a.m=b.m=1;merges.push([a,b]);continue}
        const ma=a.r*a.r, mb=b.r*b.r, ov=(min-d), ka=mb/(ma+mb), kb=ma/(ma+mb);
        a.x-=nx*ov*ka; a.y-=ny*ov*ka; b.x+=nx*ov*kb; b.y+=ny*ov*kb;
        const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(vn<0){const jm=-(1.15)*vn/(1/ma+1/mb); a.vx-=jm*nx/ma; a.vy-=jm*ny/ma; b.vx+=jm*nx/mb; b.vy+=jm*ny/mb;
          const tx=-ny, ty=nx, vt=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty, f=vt*.04; a.vx+=f*tx; a.vy+=f*ty; b.vx-=f*tx; b.vy-=f*ty}
      }
    }
    for(const o of bs){
      if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)*.3} if(o.x>PW-o.r){o.x=PW-o.r;o.vx=-Math.abs(o.vx)*.3}
      if(o.y>PH-o.r){o.y=PH-o.r;if(o.vy>0)o.vy*=-.2;o.vx*=.97}
    }
  }
  for(const [a,b] of merges){
    if(a.dead||b.dead) continue; a.dead=b.dead=1;
    const x=(a.x*a.r*a.r+b.x*b.r*b.r)/(a.r*a.r+b.r*b.r), y=(a.y+b.y)/2, l=a.l+1;
    if(l>=PLV.length){PD.score+=1500;pdBurst(x,y,'#FFFFFF',40);pdText('고래 둘이 만나 바다 축제! +1500',x,y);confetti(60);sfx.ok();continue}
    const n={id:++PD.id,l,r:PLV[l].r,x,y,vx:(a.vx+b.vx)/2,vy:Math.min(a.vy,b.vy)-1.2,a:0,age:3,grow:.55};
    PD.b.push(n); const gain=(l+1)*(l+1)*5; PD.score+=gain; PD.merges++;
    pdBurst(x,y,PLV[l].c[1],8+l*2); pdText(`+${gain}`,x,y);
    if(l>PD.maxL){PD.maxL=l;if(l>=4){pdText(`${PLV[l].n} 등장!`,x,y-PLV[l].r-10,1);sfx.ok()}}
    beep(380+l*70,.12,'sine',.08,1.4);
  }
  PD.b=PD.b.filter(o=>!o.dead);
  for(const o of PD.b){if(o.grow){o.grow=Math.min(1,o.grow+.08);if(o.grow>=1)delete o.grow}}

  const high=PD.b.some(o=>o.age>90&&o.y-o.r<PLINE);

  if(PD.danger>130&&!PD.over){PD.over=true;setTimeout(()=>{if(SCREEN==='drop')dropOver()},700)}
}
function pdBurst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=1.5+Math.random()*3.5;PD.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:i%3?col:'#FFFFFF',r:2+Math.random()*3})}}

function pdRender(){
  const ctx=pdCtx, k=PD.scale*PD.dpr; ctx.setTransform(k,0,0,k,0,0);
  const bg=ctx.createLinearGradient(0,0,0,PH); bg.addColorStop(0,'#6CC6E2'); bg.addColorStop(.5,'#2E8DB4'); bg.addColorStop(1,'#165273');
  ctx.fillStyle=bg; ctx.fillRect(0,0,PW,PH);
  ctx.fillStyle='rgba(255,255,255,.08)'; for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(40+i*70,0);ctx.lineTo(70+i*70,0);ctx.lineTo(10+i*70+PD.t%40*.2,PH);ctx.lineTo(-20+i*70,PH);ctx.fill()}
  for(const u of PD.bub){u.y-=u.s;if(u.y<-10){u.y=PH+10;u.x=Math.random()*PW}ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(u.x+Math.sin((PD.t+u.y)*.03)*3,u.y,u.r,0,7);ctx.stroke()}
  const sand=ctx.createLinearGradient(0,PH-26,0,PH); sand.addColorStop(0,'#F2D8A2'); sand.addColorStop(1,'#D9B577');
  ctx.fillStyle=sand; ctx.beginPath(); ctx.moveTo(0,PH-14); for(let x=0;x<=PW;x+=30)ctx.quadraticCurveTo(x+15,PH-24,x+30,PH-14); ctx.lineTo(PW,PH); ctx.lineTo(0,PH); ctx.fill();
  /* 위험선 */
  const warn=PD.danger>0; ctx.save(); ctx.setLineDash([10,8]); ctx.lineWidth=3;
  ctx.strokeStyle=warn?`rgba(255,${90+Math.sin(PD.t*.3)*60|0},90,.95)`:'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(0,PLINE); ctx.lineTo(PW,PLINE); ctx.stroke(); ctx.restore();
  if(warn){ctx.fillStyle=`rgba(255,80,80,${Math.min(.25,PD.danger/400)})`;ctx.fillRect(0,0,PW,PLINE)}
  /* 조준선 + 지금 떨어뜨릴 친구 */
  if(!PD.over){const r=PLV[PD.cur].r, ax=pdClamp(PD.aim);
    ctx.save(); ctx.setLineDash([3,9]); ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ax,PDROP+r); ctx.lineTo(ax,PH); ctx.stroke(); ctx.restore();
    ctx.globalAlpha=PD.cool>0?.45:1; pdDraw(ctx,PD.cur,ax,PDROP-6+Math.sin(PD.t*.08)*2,r,0); ctx.globalAlpha=1}
  for(const o of PD.b){const g=o.grow?(.55+.45*o.grow+(o.grow<1?Math.sin(o.grow*Math.PI)*.15:0)):1, sp=pdSprite(o.l), h=sp.half*g, r=o.r*g;
    ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.a); ctx.drawImage(sp.cv,-h,-h,h*2,h*2); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(o.x-r*.38,o.y-r*.45,r*.26,r*.14,-.6,0,7); ctx.fill()}
  for(const f of PD.fx){ctx.globalAlpha=f.life;ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,f.r*f.life+.5,0,7);ctx.fill()} ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.lineJoin='round';
  for(const t of PD.txt){ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=`${t.big?26:20}px Jua, sans-serif`;ctx.lineWidth=5;ctx.strokeStyle=t.big?'#2B4C94':'#8C4E12';ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.big?'#fff':'#FFF3B3';ctx.fillText(t.t,t.x,t.y)} ctx.globalAlpha=1;
}
function pdLoop(){
  if(SCREEN!=='drop'||!PD){pdRaf=0;return}
  PD.t++; if(PD.cool>0)PD.cool--;
  if(!PD.over&&!PD.pause) pdPhysics();
  for(const f of PD.fx){f.x+=f.vx;f.y+=f.vy;f.vy+=.12;f.life-=.03} PD.fx=PD.fx.filter(f=>f.life>0);
  for(const t of PD.txt){t.y-=.7;t.life-=.016} PD.txt=PD.txt.filter(t=>t.life>0);
  if(PD.score>=PD.nextB&&!PD.over){while(PD.score>=PD.nextB){PD.bonus++;PD.nextB+=PBONUS}toast('보너스 퀴즈 병이 떠올랐어요! 풀고 싶을 때 눌러요')}
  if(PD.t%6===0) renderDropTop();
  pdRender(); pdRaf=requestAnimationFrame(pdLoop);
}

/* ===== 소문 던전 · 그림 탐험 (dungeon.html 을 화면 가득 띄워요) =====
   dungeon.html ↔ 본게임 메시지: dq:need → dq:q(drawQ 문제) · dq:ans(틀리면 오답 노트) · dq:stars(별빛 조각 → ⭐) · dq:floor · dq:clear · dq:exit
   저장: chState(ci).caveBest(도착한 층, 정복하면 3) · caveWins */
let CAVE=null;
function openCave(){
  const ci=CI, c=chState(ci); if(c.caveBest==null)c.caveBest=0; if(c.caveWins==null)c.caveWins=0;
  CAVE={ci,sent:{},stars:0}; ttsStop(); coachEnd(true);
  $('#caveFrame').src='dungeon.html?ch='+encodeURIComponent(CH[ci].id)+'&g='+curGrade();
  $('#cave').hidden=false;
}
function closeCave(){
  if(!CAVE) return; const ci=CAVE.ci, got=CAVE.stars; CAVE=null;
  $('#caveFrame').src='about:blank'; $('#cave').hidden=true;
  goHub(ci); if(got) toast(`소문 던전에서 모은 별 ⭐${got}개!`);
}
window.addEventListener('message',e=>{
  const f=$('#caveFrame'); if(!CAVE||!f||e.source!==f.contentWindow) return;
  const d=e.data; if(!d||typeof d!=='object') return; const ci=CAVE.ci, c=chState(ci);
  if(d.t==='dq:need'){const q=drawQ(ci); CAVE.sent[q.q]=q; f.contentWindow.postMessage({t:'dq:q',q:{q:q.q,o:q.o,a:q.a,x:q.x||'',z:CH[ci].theme}},'*')}
  else if(d.t==='dq:ans'){const q=CAVE.sent[d.q]; if(q&&!d.ok) wrongAdd(ci,q)}
  else if(d.t==='dq:stars'){const n=Math.max(0,Math.min(5,d.n|0)); if(n){c.stars+=n;CAVE.stars+=n;save()}}
  else if(d.t==='dq:floor'){const n=d.n|0; if(n>(c.caveBest||0)){c.caveBest=n;save()}}
  else if(d.t==='dq:clear'){c.caveBest=3;c.caveWins=(c.caveWins||0)+1;c.stars+=2;CAVE.stars+=2;save()}
  else if(d.t==='dq:exit'){closeCave()}
});
/* ===== 놀이 3: 소문 던전 (로그라이트) ===== */
const FLOORS=7;
const MONSTERS=[{e:'👻',n:'헛소문 유령'},{e:'🦇',n:'뜬소문 박쥐'},{e:'🐙',n:'카더라 문어'},{e:'👾',n:'와전 외계인'},{e:'🦊',n:'소곤소곤 여우'},{e:'🐸',n:'개굴 뒷말 개구리'}];

  game:{e:'🎮',n:'도전의 방',d:'미니게임 성공하면 ⭐1 + 선물'},
  rest:{e:'⛲',n:'쉼터 샘물',d:'❤️ 하트 1개 회복'},
  boss:{e:'👑',n:'대왕의 방',d:'마지막 보스! 이기면 ⭐3'}
};
const BUFFS={

  shield:{e:'🛡️',n:'방패',d:'틀려도 한 번 막아 줘요'},
  hint:{e:'💡',n:'힌트',d:'오답 보기 하나를 지워요'},
  star:{e:'⭐',n:'별 +1',d:'이 구역 별을 바로 받아요'}
};
let D=null;
const dwrap=$('#dwrap');
function openDungeon(){
  show('dungeon');
  D={floor:1,hp:3,maxHp:5,shield:0,hint:1,stars:0,kills:0,bag:{},phase:'doors',doors:null};
  D.doors=makeDoors(); renderDungeon();
  if(!S.tut.dungeon) setTimeout(()=>coachStart(dungeonTutorial(),()=>{S.tut.dungeon=true;save()}),300);
}
function makeDoors(){
  if(D.floor===FLOORS) return ['boss'];
  if(D.floor===1) return shuffle(['monster','treasure']);
  const pool=['monster','monster','monster','treasure','treasure','game','game','rest'];
  const out=['monster']; while(out.length<3){const t=rnd(pool); if(t==='monster'||!out.includes(t)) out.push(t)}
  if(D.hp>=D.maxHp) for(let i=0;i<out.length;i++) if(out[i]==='rest') out[i]='treasure';
  return shuffle(out);
}
function statusCard(){
  return `<div class="card status" id="dStatus"><span class="hearts em" aria-label="하트 ${D.hp}개">${'❤️'.repeat(Math.max(0,D.hp))}${'🤍'.repeat(Math.max(0,D.maxHp-D.hp))}</span>
    <span class="chipr" style="box-shadow:none;background:var(--lavL)"><span class="em">🛡️</span>${D.shield}</span><span class="chipr" style="box-shadow:none;background:var(--butterL)"><span class="em">💡</span>${D.hint}</span>
    <span class="path">${Array.from({length:FLOORS},(_,i)=>i===FLOORS-1?`<i class="boss em">👑</i>`:`<i class="${i+1<D.floor?'done':i+1===D.floor?'now':''}"></i>`).join('')}</span></div>`;
}
function statusHTML(){
  const ch=CH[CI];
  return `<div class="pillbar"><button class="ibtn" id="dBack" aria-label="구역으로"><span class="em">🏠</span></button>
    <span class="chipr"><span class="em">⭐</span><span class="sVal">${chState(CI).stars}</span></span><span class="sp"></span>
    <span class="tag" style="background:${ch.tint}">${esc(ch.theme)}</span></div>`+statusCard();
}
function renderDungeonStatus(){if(SCREEN!=='dungeon'||!D)return;const s=$('#dStatus');if(s)s.outerHTML=statusCard();$$('.sVal').forEach(e=>e.textContent=chState(CI).stars)}
function leaveDungeon(){

    const sh=openModal(`<h2>모험을 그만할까요?</h2><p class="note">지금까지 모은 별 ⭐${D.stars}개는 그대로 남아요.</p><div class="row"><button class="cbtn ghost" id="no">계속 모험</button><button class="cbtn" id="yes">구역으로</button></div>`);

function renderDungeon(){

    body=`<div class="card dstage"><h2>${D.floor===FLOORS?'👑 마지막 층!':`${D.floor}층`} · 문을 골라요</h2>

function nextFloor(){D.floor++;D.phase='doors';D.doors=makeDoors();renderDungeon();window.scrollTo(0,0)}
function enterRoom(t){

  if(t==='treasure') chooseBuff('보물 상자를 열었어요!',()=>nextFloor());

function chooseBuff(title,then){

    const k=b.dataset.k; if(k==='heart'){D.maxHp=Math.max(D.maxHp,D.hp+1);D.hp=Math.min(D.maxHp,D.hp+1)} if(k==='shield')D.shield++; if(k==='hint')D.hint++; if(k==='star')gainStar(1);

function fight(mon,hp,boss){
  D.phase='fight'; let mhp=hp;
  const ch=CH[CI];
  const draw=(msg)=>{
    dwrap.innerHTML=statusHTML()+`<div class="card dstage"><div class="monster em" id="mon">${mon.e}</div><h2>${boss?'👑 ':''}${esc(mon.n)}</h2>
      <div class="hpbar">${Array.from({length:hp},(_,i)=>`<i class="${i<mhp?'':'off'}"></i>`).join('')}</div>
      <div class="bubble" style="background:var(--lavL);box-shadow:none">${esc(msg)}</div>
      ${mhp>0&&D.hp>0?'<div class="row" style="justify-content:center"><button class="cbtn lav" id="atk">⚔️ 퀴즈로 공격!</button></div>':''}</div>`;
    $('#dBack').onclick=leaveDungeon;
    const a=$('#atk'); if(a) a.onclick=ask;
  };
  const ask=()=>{
    const q=drawQ(CI,D.bag);
    runQuiz(q,{tag:`⚔️ ${mon.n}`,title:boss?'보스전!':`${D.floor}층`,closable:false,rightLabel:'공격!',wrongLabel:'으악!',
      hint:{n:D.hint,use:()=>{D.hint--;renderDungeonStatus()}},
      onRight:()=>{mhp--;sfx.hit();draw(mhp>0?`으윽! 아직 안 끝났다! (남은 체력 ${mhp})`:'으아악… 소문이 사라진다~!');const m=$('#mon');m.classList.add('hit');
        if(mhp<=0){setTimeout(()=>win(),700)}},
      onWrong:()=>{if(D.shield>0){D.shield--;toast('🛡️ 방패가 막아 줬어요!')}else{D.hp--;sfx.hurt()}
        draw(D.hp>0?`카더라~ 확인도 안 했지? 히히!`:'');if(D.hp<=0)setTimeout(()=>endRun(false),600)}});
  };
  let won=false;
  const win=()=>{
    if(won) return; won=true; D.kills++; confetti(boss?80:20);
    if(boss){gainStar(3);endRun(true)}else{gainStar(1);toast(`${mon.n}을(를) 물리쳤어요! ⭐1`);nextFloor()}
  };
  draw(boss?`크하하! 나는 ${mon.n}! "${ch.rumor}" 이 소문은 진짜라고!`:rnd(['카더라~ 내 말이 다 맞아!','소문은 원래 다 진짜야~','확인 같은 건 안 해도 돼~']));

function endRun(victory,quit){

    <p class="note">${victory?'소문 던전을 끝까지 통과했어요! 진짜 탐정이에요.':`${D.floor}층까지 갔어요. 틀린 문제의 해설을 기억하면 다음엔 더 멀리 갈 수 있어요!`}</p>
    <p class="note">물리친 괴물 ${D.kills}마리 · 이번 모험에서 모은 별 ⭐${D.stars}</p></div>
    <div class="row" style="justify-content:center"><button class="cbtn ghost" id="hub">🏠 구역으로</button><button class="cbtn lav" id="again">다시 모험!</button></div>`,{closable:false});
  sh.querySelector('#hub').onclick=()=>{closeModal();goHub()};
  sh.querySelector('#again').onclick=()=>{closeModal();openDungeon()};
}
