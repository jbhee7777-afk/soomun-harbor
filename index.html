<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>소문 항구 탐정단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 맑은 낮의 파스텔 항구: 한 가지 밝은 세계로 고정한 게임 화면 (모든 색을 직접 지정) */
:root{
  --sky1:#BFE6FF; --sky2:#EAF7FF; --sea:#8ED8EC; --sea2:#4FB7D6;
  --cream:#FFF8EE; --sand:#FFE9C7; --sand2:#F4D3A1;
  --pink:#FF8FB1; --pink2:#E86A93; --pinkL:#FFE1EA;
  --mint:#7FDDB8; --mint2:#3FB98A; --mintL:#DDF7EC;
  --butter:#FFD66B; --butter2:#E9AF2E; --butterL:#FFF3CC;
  --lav:#BBA9FF; --lav2:#8E77EE; --lavL:#EEE9FF;
  --coral:#FF8C74; --coral2:#E4644B;
  --ink:#4A3845; --ink2:#8E7885; --white:#FFFFFF;
  --disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:19px;font-weight:400;line-height:1.4;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,#F4FBFF 100%);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px),radial-gradient(circle at 78% 8%,#fff 0 2px,transparent 3px),radial-gradient(circle at 55% 30%,#fff 0 1.5px,transparent 2.5px);background-size:220px 180px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--butter2);outline-offset:2px}
.em{font-family:var(--emoji);line-height:1}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;box-sizing:border-box}

/* 손글씨 느낌 */


.sect h2{background:linear-gradient(transparent 58%,var(--butterL) 58%,var(--butterL) 90%,transparent 90%);padding:0 4px}
.tile:nth-child(odd){rotate:-.8deg}.tile:nth-child(even){rotate:.7deg}
.tile::after{content:"";position:absolute;top:-8px;left:50%;width:54px;height:18px;margin-left:-27px;background:rgba(255,255,255,.65);border-left:2px dashed rgba(0,0,0,.06);border-right:2px dashed rgba(0,0,0,.06);rotate:-4deg;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card,.sheet,.bubble{background-image:radial-gradient(rgba(142,120,133,.05) 1px,transparent 1.2px);background-size:7px 7px}
.sheet{border:3px dashed #F3E4EB;background-clip:padding-box}
.mode{border:3px dashed rgba(255,255,255,.8)}
.mode:nth-child(odd){rotate:-.6deg}.mode:nth-child(even){rotate:.6deg}

.tile .tag{align-self:flex-start}
/* 공통 조각 */
.card{background:var(--white);border-radius:24px;box-shadow:0 6px 0 rgba(120,90,110,.12),0 14px 30px rgba(80,120,160,.12)}
.cbtn{font-family:var(--disp);font-size:24px;color:#fff;padding:11px 20px;border-radius:999px;background:linear-gradient(180deg,#FFA6C2,var(--pink));box-shadow:0 5px 0 var(--pink2);text-shadow:0 1px 0 rgba(0,0,0,.12);display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .08s}
.cbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink2)}
.cbtn.mint{background:linear-gradient(180deg,#9DEBCB,var(--mint));box-shadow:0 5px 0 var(--mint2)}
.cbtn.butter{background:linear-gradient(180deg,#FFE292,var(--butter));box-shadow:0 5px 0 var(--butter2);color:var(--ink);text-shadow:none}
.cbtn.lav{background:linear-gradient(180deg,#D0C3FF,var(--lav));box-shadow:0 5px 0 var(--lav2)}
.cbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #E6D9E0;text-shadow:none}
.cbtn[disabled]{filter:grayscale(.7);opacity:.6;cursor:default}
.pillbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chipr{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:5px 12px 5px 7px;font-family:var(--disp);font-size:22px;box-shadow:0 3px 0 rgba(120,90,110,.12);font-variant-numeric:tabular-nums}
.chipr .em{font-size:25px}
.chipr small{font-family:var(--body);font-size:16px;color:var(--ink2)}
.ibtn{width:44px;height:44px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 rgba(120,90,110,.14)}
.ibtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(120,90,110,.14)}
.sp{flex:1}
.tag{display:inline-block;font-family:var(--disp);font-size:17px;padding:3px 10px;border-radius:999px;background:var(--tint,var(--pink));color:#fff}
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 35% 30%,#fff 0,var(--tintL,#FFE1EA) 70%);box-shadow:0 0 0 4px #fff,0 4px 0 5px rgba(120,90,110,.12);flex:none}
.gullsvg{display:block}

/* ---------- 지도 ---------- */
#map{overflow-y:auto;padding:14px 16px 40px}
.mapwrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;border-radius:30px;overflow:hidden;box-shadow:0 8px 0 rgba(79,183,214,.35),0 18px 40px rgba(60,130,170,.2);background:var(--sky1)}
.hero svg.scene{display:block;width:100%;height:auto;aspect-ratio:800/300;min-height:190px}
.logo{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none}
.logo h1{font-size:clamp(40px,8vw,76px);color:#fff;letter-spacing:1px;
  text-shadow:0 3px 0 var(--pink2),0 6px 0 var(--pink2),0 10px 18px rgba(232,106,147,.45);-webkit-text-stroke:2px var(--pink2);paint-order:stroke fill}
.logo p{margin:6px auto 0;display:inline-block;font-family:var(--disp);font-size:clamp(17px,2.6vw,22px);color:var(--ink);background:rgba(255,255,255,.85);padding:5px 14px;border-radius:999px}
.herobtns{position:absolute;right:12px;top:12px;display:flex;gap:8px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 4px}
.sect h2{font-size:29px;color:var(--ink)}
.sect span{color:var(--ink2);font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;text-align:left;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:7px;min-height:168px;
  background:linear-gradient(180deg,#fff 0%,#fff 55%,var(--tintL) 100%);box-shadow:0 6px 0 var(--tintD),0 12px 24px rgba(80,120,160,.12);transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-.5deg)}
.tile:active{transform:translateY(2px)}
.tile .ic{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:38px;background:var(--tintL);box-shadow:inset 0 -4px 0 rgba(0,0,0,.05)}
.tile .pl{font-family:var(--disp);font-size:25px}
.tile .rm{font-size:17px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clues{display:flex;gap:3px;margin-top:auto}
.clues i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.3}
.clues i.on{filter:none;opacity:1}
.tile .stamp{position:absolute;top:12px;right:12px;font-family:var(--disp);font-size:17px;color:#fff;background:var(--mint2);border-radius:999px;padding:3px 9px;transform:rotate(8deg);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tcards{display:flex;gap:10px;flex-wrap:wrap}
.tcard{width:72px;height:94px;border-radius:16px;display:grid;place-items:center;font-size:36px;background:rgba(255,255,255,.5);border:3px dashed rgba(142,120,133,.35)}
.tcard.got{border:0;background:linear-gradient(180deg,#fff,var(--tintL));box-shadow:0 5px 0 var(--tintD)}
.tcard:not(.got) .em{filter:grayscale(1);opacity:.3}

/* ---------- 구역 허브 ---------- */
#hub{overflow-y:auto;padding:12px 16px 30px}
.hubwrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stage{position:relative;border-radius:28px;overflow:hidden;box-shadow:0 7px 0 var(--tintD),0 16px 30px rgba(80,120,160,.15)}
.stage svg.scene{display:block;width:100%;height:auto;aspect-ratio:800/260;min-height:170px}
.stage .talkrow{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:10px}
.stage .bubble{flex:1}
.stage .place{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage .place h2{font-size:clamp(24px,4.5vw,34px);color:var(--ink);background:rgba(255,255,255,.92);padding:4px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(74,56,69,.12)}
.bubble{background:#fff;border-radius:20px;padding:10px 14px;font-size:21px;line-height:1.45;box-shadow:0 4px 0 rgba(120,90,110,.12);position:relative}
.bubble b.n{display:block;font-family:var(--disp);font-weight:400;font-size:18px;color:var(--pink2)}
.bubble.gull b.n{color:#C9861B}
.bubble q{quotes:"“" "”"}
.bubble .solved{color:var(--mint2);font-family:var(--disp)}
.trail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px}
.trail .lbl{font-family:var(--disp);font-size:21px;margin-right:2px}
.slots{display:flex;gap:8px}
.slot{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:34px;background:var(--cream);border:3px dashed #EBDCCB}
.slot.off .em{filter:grayscale(1);opacity:.25}
.slot.on{border:0;background:var(--tintL);box-shadow:0 4px 0 var(--tintD)}
.slot.pop{animation:pop .6s}
.meter{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px}
.meter .bar{height:14px;border-radius:999px;background:#F3E8EE;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.05)}
.meter .bar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(135deg,var(--coral) 0 10px,#FFA58F 10px 20px);transition:width .6s}
.meter small{font-size:16px;color:var(--ink2)}
.storybtn.ready{animation:bob 1.4s infinite}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mode{border-radius:26px;padding:16px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;color:var(--ink);transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode:active{transform:translateY(2px)}
.mode .big{font-size:52px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.mode h3{font-size:28px}
.mode p{margin:0;font-size:18px;line-height:1.4;color:var(--ink)}
.mode .rec{margin-top:auto;font-family:var(--disp);font-size:18px;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;align-self:flex-start}
.mode.m1{background:linear-gradient(160deg,#FFF4D6,#FFE3A3);box-shadow:0 6px 0 #EFC76A}
.mode.m2{background:linear-gradient(160deg,#FFE6EF,#FFC3D6);box-shadow:0 6px 0 #EE9DB7}
.mode.m4{background:linear-gradient(160deg,#DDF7EC,#A9EDD0);box-shadow:0 6px 0 #6FCFA8}
.mode.m3{background:linear-gradient(160deg,#EEE9FF,#CFC2FF);box-shadow:0 6px 0 #A996F0}
.mode .deco{position:absolute;right:-12px;top:-12px;font-size:78px;opacity:.16;transform:rotate(14deg)}
.hint{font-size:18px;color:var(--ink2);text-align:center}

/* ---------- 항구 합치기 ---------- */
#merge{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:10px 16px 12px;height:100%;overflow-y:auto}
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.order{background:#fff;border-radius:20px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;box-shadow:0 5px 0 rgba(120,90,110,.12);position:relative}
.order.ready{box-shadow:0 5px 0 var(--mint2),0 0 0 3px var(--mint)}
.order .who{display:flex;align-items:center;gap:5px;font-size:16px;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .who .em{font-size:28px}
.needs{display:flex;gap:5px}
.need{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c0) 75%)}
.need.c1{background:radial-gradient(circle at 35% 30%,#fff 0,var(--c1) 75%)}
.need.have::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--mint2);color:#fff;font-size:16px;display:grid;place-items:center;font-weight:700;border:2px solid #fff}
.order .rw{font-size:16px;color:var(--ink2);font-variant-numeric:tabular-nums}
.order .give{font-family:var(--disp);font-size:20px;border-radius:999px;padding:4px 14px;background:linear-gradient(180deg,#9DEBCB,var(--mint));color:#fff;box-shadow:0 3px 0 var(--mint2)}
.order .give[disabled]{background:#F1ECEF;color:#B9A9B2;box-shadow:none;cursor:default}
.boardwrap{min-height:0;display:grid;place-items:center}
.board{--cell:54px;display:grid;grid-template-columns:repeat(7,var(--cell));grid-auto-rows:var(--cell);gap:4px;padding:10px;border-radius:28px;
  background:#FFF3E0;box-shadow:0 0 0 5px #fff,0 9px 0 5px #F2D3AE,0 18px 30px rgba(120,90,60,.18);touch-action:none;user-select:none;-webkit-user-select:none}
.cell{border-radius:14px;background:#FFE9CC;position:relative;display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(0,0,0,.035)}
.cell:nth-child(odd){background:#FFF0DB}
.cell.tgt{box-shadow:inset 0 0 0 3px var(--butter2)}
.cell.sel .tok{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink)}
.tok{width:88%;height:88%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--cell)*.52);position:relative;
  background:radial-gradient(circle at 34% 28%,#fff 0 12%,var(--c0) 60%,var(--c0d) 100%);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.tok.c1{background:radial-gradient(circle at 34% 28%,#fff 0 12%,var(--c1) 60%,var(--c1d) 100%)}
.tok .em{pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.tok .lv{position:absolute;left:-2px;bottom:-2px;font-style:normal;font-family:var(--disp);font-size:calc(var(--cell)*.26);color:#fff;background:var(--ink2);border-radius:999px;min-width:1.35em;height:1.35em;display:grid;place-items:center;border:2px solid #fff}
.tok.l5 .lv{background:var(--butter2)}
.tok.gen{border-radius:30%;background:linear-gradient(180deg,#fff,#FFE8A8);box-shadow:0 4px 0 var(--butter2);animation:breathe 2.2s infinite}
.tok.gen::after{content:"✨";position:absolute;right:-4px;top:-6px;font-size:calc(var(--cell)*.26);font-family:var(--emoji);animation:twinkle 1.6s infinite}
.tok.box{border-radius:28%;background:linear-gradient(180deg,#FFD1E0,var(--pink));box-shadow:0 4px 0 var(--pink2);animation:wiggle 1.2s infinite}
.tok.match::before{content:"✓";position:absolute;right:-3px;top:-3px;width:calc(var(--cell)*.3);height:calc(var(--cell)*.3);border-radius:50%;background:var(--mint2);color:#fff;
  font-size:calc(var(--cell)*.18);display:grid;place-items:center;font-weight:700;font-family:var(--body);border:2px solid #fff;z-index:1}
.tok.drag{opacity:.25}
.tok.pop{animation:pop .35s}
.tok.spawn{animation:spawn .3s}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:40;filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.info{background:#fff;border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:54px;box-shadow:0 5px 0 rgba(120,90,110,.12)}
.info .big{font-size:38px}
.info .txt{flex:1;min-width:0}
.info .nm{font-family:var(--disp);font-size:22px}
.info .ds{font-size:17px;color:var(--ink2);line-height:1.35}
.chain{display:inline-flex;gap:3px;font-size:21px;vertical-align:middle;margin-left:4px}
.chain .em.me{background:var(--butterL);border-radius:6px;box-shadow:0 0 0 2px var(--butter)}
.sell{font-family:var(--disp);font-size:18px;border-radius:999px;padding:7px 12px;background:var(--butterL);box-shadow:0 3px 0 #F0D78C;white-space:nowrap}
.readypill{font-family:var(--disp);font-size:20px;color:#fff;background:linear-gradient(180deg,#FFA58F,var(--coral));box-shadow:0 4px 0 var(--coral2);border-radius:999px;padding:7px 12px;animation:bob 1.4s infinite}
.combo{position:fixed;z-index:46;pointer-events:none;font-family:var(--disp);font-size:34px;color:#fff;-webkit-text-stroke:2px var(--pink2);paint-order:stroke fill;animation:combo .9s forwards}
@media (min-aspect-ratio:1/1) and (min-width:820px){
  #merge{grid-template-columns:minmax(260px,330px) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:18px}
  #merge .topbar{grid-column:1 / -1}
  #merge .orders{grid-column:1;grid-row:2;grid-template-columns:1fr;align-content:start}
  #merge .order{flex-direction:row;justify-content:space-between;padding:10px 12px}
  #merge .order .who{flex-direction:column;gap:2px;width:66px;white-space:normal;text-align:center;font-size:16px}
  #merge .order .who .em{font-size:34px}
  #merge .boardwrap{grid-column:2;grid-row:2}
  #merge .info{grid-column:1 / -1;grid-row:3}
}
#merge.scroll{grid-template-rows:auto auto auto auto}
#merge.scroll .info{position:sticky;bottom:0;z-index:5}

/* 항구 합치기: 나무 부두 판 · 합체 연출 */
#merge{background:linear-gradient(180deg,rgba(191,230,255,.6),rgba(255,233,199,.6))}
.board{position:relative;background:linear-gradient(180deg,#C98E57,#A86E3C);box-shadow:inset 0 0 0 3px #E2AE73,0 0 0 4px #7A4A22,0 9px 0 4px #5E3515,0 18px 30px rgba(90,55,20,.3)}
.board::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;background:repeating-linear-gradient(176deg,transparent 0 11px,rgba(80,40,12,.3) 11px 12px,transparent 12px 23px)}
.cell{background:rgba(255,240,214,.92);box-shadow:inset 0 3px 6px rgba(90,50,20,.28),inset 0 -2px 0 rgba(255,255,255,.45)}
.cell:nth-child(odd){background:rgba(255,247,230,.96)}
.cell.tgt{box-shadow:inset 0 0 0 3px var(--butter2),0 0 12px 2px rgba(255,214,107,.8)}
.tok{box-shadow:0 4px 0 rgba(0,0,0,.13),inset 0 -4px 0 rgba(0,0,0,.08)}
.cell.mate .tok{animation:mmate .8s ease-in-out infinite;box-shadow:0 0 0 3px #fff,0 0 16px 5px #FFE066}
@keyframes mmate{50%{transform:scale(1.1)}}
.tok.hint{animation:wiggle .9s ease-in-out infinite}
.tok.fly{animation:mfly .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes mfly{from{transform:translate(var(--fx,0),var(--fy,0)) scale(.35);opacity:.6}}
.tok.pop{animation:mpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes mpop{0%{transform:scale(.4)}55%{transform:scale(1.3);filter:brightness(1.35)}100%{transform:scale(1)}}
/* 공통 터짐 효과 (화면 좌표) */
.fxp{position:fixed;z-index:47;pointer-events:none;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:fxp .65s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fxp{0%{transform:translate(0,0) scale(1.3)}100%{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(0);opacity:.3}}
.fxr{position:fixed;z-index:47;pointer-events:none;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;border:4px solid #fff;box-sizing:border-box;animation:mring .5s ease-out forwards}
/* ---------- 블록 퍼즐 ---------- */
#block{display:flex;flex-direction:column;gap:10px;padding:10px 16px 14px;height:100%;overflow-y:auto}
.bmain{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.score{font-family:var(--disp);font-size:45px;line-height:1;color:#fff;-webkit-text-stroke:2px var(--lav2);paint-order:stroke fill;text-shadow:0 4px 0 var(--lav2);font-variant-numeric:tabular-nums}
.qgauge{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 rgba(120,90,110,.12);font-family:var(--disp);font-size:18px}
.qgauge i{width:22px;height:12px;border-radius:999px;background:#EFE6F7}
.qgauge i.on{background:linear-gradient(90deg,var(--lav),var(--pink))}
.bboard{--bc:40px;display:grid;grid-template-columns:repeat(8,var(--bc));grid-auto-rows:var(--bc);gap:3px;padding:9px;border-radius:24px;background:#6F5A8E;
  box-shadow:0 0 0 5px #fff,0 9px 0 5px #D9CCF2,0 18px 30px rgba(90,70,140,.2);touch-action:none}
.bcell{border-radius:9px;background:#826EA3;box-shadow:inset 0 3px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-size:calc(var(--bc)*.55)}
.bcell.f,.pcell{border-radius:9px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.55);display:grid;place-items:center}
.bcell.pv{background:rgba(255,255,255,.5)!important;box-shadow:inset 0 0 0 3px #fff}
.bcell.pvl{filter:brightness(1.18) saturate(1.2)}
.bcell.clr{animation:clr .32s forwards}
.tray{--pc:22px;display:flex;justify-content:center;align-items:center;gap:14px;width:100%;min-height:110px;flex-wrap:nowrap;touch-action:none}
.piece{display:grid;gap:2px;padding:8px;border-radius:16px;touch-action:none;cursor:grab;transition:transform .12s}
.piece:hover{transform:scale(1.05)}
.piece.used{visibility:hidden}
.piece.nofit{opacity:.35}
.pcell{width:var(--pc);height:var(--pc);font-size:calc(var(--pc)*.6)}
.pcell.e{background:transparent;box-shadow:none}
/* 블록 퍼즐: 바다 유리 블록 · 나무 테 판 */
#block{background:linear-gradient(180deg,rgba(207,194,255,.45),rgba(191,230,255,.55))}
.bboard{position:relative;background:radial-gradient(90% 70% at 30% 15%,#3A9CBF 0%,#1F6F92 55%,#123F5A 100%);
  box-shadow:inset 0 10px 22px rgba(0,20,40,.45),0 0 0 6px #BF8246,0 0 0 8px #7E4A20,0 0 0 10px #E6B57C,0 12px 0 9px #4A2A10,0 22px 32px 8px rgba(30,20,60,.35)}
.bcell{background:rgba(255,255,255,.1);box-shadow:inset 0 3px 6px rgba(0,25,45,.35),inset 0 -1px 0 rgba(255,255,255,.15)}
.bcell.f,.pcell{position:relative;background-image:linear-gradient(155deg,rgba(255,255,255,.65) 0 18%,rgba(255,255,255,.12) 19% 52%,rgba(0,0,0,.14) 100%);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.6),0 2px 3px rgba(0,20,40,.35)}
.bcell.f::after,.pcell:not(.e)::after{content:"";position:absolute;right:16%;bottom:18%;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.45)}
.pcell.e::after{display:none}
.bcell.pv{background:rgba(255,250,215,.55)!important;box-shadow:inset 0 0 0 3px #FFF3B0,0 0 10px rgba(255,240,160,.8)}
.bcell.pvl{filter:brightness(1.3) saturate(1.3);animation:mglow .6s ease-in-out infinite}
.bcell.put{animation:bput .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bput{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.bcell.clr{animation:bclr .42s ease-in forwards}
@keyframes bclr{0%{transform:scale(1)}35%{transform:scale(1.25);filter:brightness(1.9)}100%{transform:scale(0) rotate(25deg);opacity:0}}
.bline{position:absolute;z-index:3;pointer-events:none;border-radius:999px;background:linear-gradient(var(--bd,90deg),transparent,rgba(255,250,210,.95) 20%,#fff 50%,rgba(255,250,210,.95) 80%,transparent);box-shadow:0 0 18px 6px rgba(255,240,160,.8);animation:mbeamh .5s ease-out forwards}
.bline.v{--bd:180deg;animation-name:mbeamv}
.piece{background:rgba(255,255,255,.55);box-shadow:0 4px 0 rgba(120,90,110,.12)}
#bghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;display:grid;gap:3px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
@media (min-aspect-ratio:1/1) and (min-width:820px){
  .bmain{flex-direction:row;justify-content:center;align-items:center;gap:30px}
  .tray{flex-direction:column;width:auto;min-height:0}
  .bside{display:flex;flex-direction:column;align-items:center;gap:12px}
}

/* ---------- 소문 퐁당 (떨어뜨려 합치기) ---------- */
#drop{display:flex;flex-direction:column;gap:8px;padding:10px 12px 18px;height:100%;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;
  background:radial-gradient(130% 55% at 50% -5%,#8ADAE9 0%,#3FA3C2 40%,#1E6C8C 75%,#133F5A 100%)}
.pdframe{position:relative;margin:6px 0 4px;border-radius:30px 30px 22px 22px;padding:10px;line-height:0;
  background:linear-gradient(180deg,#D69A58,#8C5428);box-shadow:inset 0 2px 0 rgba(255,236,200,.6),0 0 0 3px #5E3515,0 12px 0 3px #4A2A10,0 22px 34px rgba(0,15,30,.5)}
.pdframe::before{content:"";position:absolute;left:24px;right:24px;top:-12px;height:16px;border-radius:10px;background:linear-gradient(180deg,#E6B57C,#A86E3C);box-shadow:0 0 0 3px #5E3515}
#pdCv{display:block;border-radius:22px 22px 14px 14px;touch-action:none;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.pdnext #pdNext{display:grid;place-items:center;height:40px}
.pdchain{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:560px;padding:4px 8px;border-radius:999px;background:rgba(10,30,50,.35)}
.pdlv{display:grid;place-items:center;line-height:0}
.pdhelp{display:grid;place-items:center;line-height:0}
.mode.m5{background:linear-gradient(160deg,#DDF1FF,#A8D8F5);box-shadow:0 6px 0 #6FB2DA}
.mode .pdcard canvas{display:block}
/* ---------- 항구 그림 지도 ---------- */
.hmap{border-radius:30px;overflow:hidden;line-height:0;box-shadow:0 8px 0 rgba(79,183,214,.35),0 18px 40px rgba(60,130,170,.2),inset 0 0 0 4px #fff}
.hsvg{display:block;width:100%;height:auto}
.hz{cursor:pointer;outline:none}
.hz .hb{transition:transform .18s;transform-box:fill-box;transform-origin:50% 100%}
.hz:hover .hb,.hz:focus-visible .hb{transform:translateY(-6px) scale(1.06)}
.hz:focus-visible .hb{filter:drop-shadow(0 0 6px #FFD66B)}
.hz:active .hb{transform:translateY(2px) scale(.97)}
.hname{font-family:var(--disp);font-size:18px;fill:#4A3845}
.hrec-t{font-family:var(--disp);font-size:14px;fill:#fff}
.hrec{animation:hrec 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hrec{50%{transform:scale(1.12);opacity:.5}}
.harrow{animation:harrow 1.2s ease-in-out infinite}
@keyframes harrow{50%{transform:translateY(-6px)}}
.hbeam{animation:mglow 1.6s ease-in-out infinite}
.hwaves{animation:hwave 4s ease-in-out infinite alternate}
@keyframes hwave{to{transform:translateX(14px)}}
.hboat{animation:hboat 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hboat.b2{animation-duration:3.8s}
@keyframes hboat{50%{transform:translateY(-4px) rotate(-3deg)}}
.hgull{animation:hgull 18s linear infinite}
@keyframes hgull{0%{transform:translate(-40px,120px)}100%{transform:translate(1040px,60px)}}
.hz.done .hb{filter:saturate(1.15)}
@media (max-width:700px){.hmap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.hsvg{width:760px;max-width:none}}
/* ---------- 소문 던전 (그림 탐험 · dungeon.html) ---------- */
#cave{position:fixed;inset:0;z-index:55;background:#0b0714}
#cave iframe{display:block;width:100%;height:100%;border:0}
.classicb{font-size:18px;padding:7px 14px}
/* ---------- 학년 고르기 ---------- */
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 6px}
.gbig{min-height:96px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05;
  background:linear-gradient(180deg,#FFFFFF,#FFF1DE);border:3px solid #F4DEC4;box-shadow:0 6px 0 #E7C9A5;transition:transform .12s}
.gbig b{font-family:var(--disp);font-weight:400;font-size:42px;color:var(--pink2)}
.gbig span{font-family:var(--disp);font-size:19px}
.gbig small{font-size:14px;color:var(--ink2);margin-top:2px}
.gbig:active{transform:translateY(3px)}
.gbig.on{background:linear-gradient(180deg,#FFB3CB,var(--pink));border-color:var(--pink2);box-shadow:0 6px 0 var(--pink2);color:#fff}
.gbig.on b,.gbig.on small{color:#fff}
.gradeb{width:auto!important;padding:0 10px;display:flex!important;align-items:baseline;gap:2px;font-family:var(--disp)}
.gradeb b{font-weight:400;font-size:24px;color:var(--pink2)}
.gradeb small{font-size:14px}
.gchips{gap:6px}.gchips .chip{min-height:40px;min-width:44px;padding:4px 10px}
.tile .recg{position:absolute;top:12px;right:12px;font-family:var(--disp);font-size:15px;color:#fff;background:var(--lav2);border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
/* ---------- 소문 팡팡 (항구 보물 3매치) ---------- */
#match{display:flex;flex-direction:column;gap:8px;padding:10px 12px 18px;height:100%;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;
  background:radial-gradient(130% 55% at 50% -5%,#7FD3E8 0%,#3B9DC0 38%,#1D6A8C 72%,#123F5A 100%)}
#match::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background:radial-gradient(ellipse 60px 8px at 20% 30%,rgba(255,255,255,.35),transparent 70%),radial-gradient(ellipse 90px 9px at 75% 55%,rgba(255,255,255,.28),transparent 70%),radial-gradient(ellipse 50px 7px at 40% 85%,rgba(255,255,255,.3),transparent 70%);background-size:320px 260px}
.mwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1}
.mhud{display:flex;align-items:stretch;gap:8px;width:100%;max-width:560px;box-sizing:border-box}
.mplank{position:relative;border-radius:14px 18px 14px 18px;padding:5px 12px 7px;color:#FFF4DC;overflow:hidden;
  background:linear-gradient(180deg,#D69A58 0%,#B0703A 55%,#8C5428 100%);
  box-shadow:inset 0 2px 0 rgba(255,236,200,.55),inset 0 -3px 0 rgba(60,30,10,.35),0 4px 0 #5E3515,0 9px 14px rgba(0,25,45,.35);text-shadow:0 2px 0 rgba(70,35,10,.55)}
.mplank::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(177deg,transparent 0 7px,rgba(100,50,15,.22) 7px 8px,transparent 8px 15px)}
.mstat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:74px}
.mstat small{font-size:15px;opacity:.92;position:relative}
.mstat b{position:relative;font-family:var(--disp);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.05}
.mstat.low b{color:#FFD0BE;animation:breathe .8s infinite}
.mgoal{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding-right:18px}
.mgoal small{position:relative;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgbar{position:relative;height:16px;border-radius:999px;background:rgba(45,20,5,.5);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.mgbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#FFF3B3,#FFCB3D 55%,#E9971B);box-shadow:inset 0 -2px 0 rgba(160,90,0,.35);transition:width .45s}
.mgbar .mk{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px}
.mgbar .mk svg{width:100%;height:100%;filter:grayscale(1) brightness(.75);opacity:.75;transition:filter .3s,opacity .3s}
.mgbar .mk.on svg{filter:drop-shadow(0 0 5px #FFF3B0);opacity:1;animation:mstar .5s}
@keyframes mstar{0%{transform:scale(.4) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
#mBonus{font-size:17px;padding:7px 12px;animation:breathe 1.2s infinite}
.mboard{--mc:48px;position:relative;box-sizing:content-box;padding:12px;margin:10px 0 16px;border-radius:20px;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(90% 70% at 30% 15%,#43B2CF 0%,#1F7A9C 50%,#0F4B67 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 12px 26px rgba(0,20,40,.5),0 0 0 7px #BF8246,0 0 0 9px #7E4A20,0 0 0 12px #E6B57C,0 0 0 14px #6B3D18,0 16px 0 12px #4A2A10,0 26px 36px 10px rgba(0,15,30,.5)}
.mboard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
  background:radial-gradient(ellipse 34px 5px at 25% 20%,rgba(255,255,255,.5),transparent 70%),radial-gradient(ellipse 44px 5px at 70% 60%,rgba(255,255,255,.4),transparent 70%);background-size:150px 120px;animation:mwave 9s linear infinite}
@keyframes mwave{to{background-position:150px 0}}
.msk{position:absolute;left:calc(12px + var(--c)*(var(--mc) + 4px));top:calc(12px + var(--r)*(var(--mc) + 4px));width:var(--mc);height:var(--mc);border-radius:28%;
  background:rgba(255,255,255,.1);box-shadow:inset 0 3px 6px rgba(0,25,45,.35),inset 0 -1px 0 rgba(255,255,255,.18)}
.msk.d{background:rgba(255,255,255,.17)}
.mt{position:absolute;left:12px;top:12px;width:var(--mc);height:var(--mc);cursor:pointer;touch-action:none;transition:transform .2s cubic-bezier(.3,1.15,.55,1);will-change:transform;z-index:1}
.mi{position:absolute;inset:0;pointer-events:none}
.mi svg{position:absolute;inset:4%;width:92%;height:92%;overflow:visible;pointer-events:none}
.mi .art{filter:drop-shadow(0 3px 1.5px rgba(0,25,45,.5))}
.mt.sp-lineH .art,.mt.sp-lineV .art,.mt.sp-bomb .art{inset:12%;width:76%;height:76%}
.mt.sp-lineV .spx{transform:rotate(90deg)}
.mt .spx{animation:mglow 1.1s ease-in-out infinite}
.mt.sp-bomb .spx{animation:mspin 2.2s linear infinite}
.mt.sp-rainbow .art{animation:mhue 3s linear infinite}
@keyframes mglow{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes mspin{to{transform:rotate(360deg)}}
@keyframes mhue{0%{filter:drop-shadow(0 3px 1.5px rgba(0,25,45,.5)) drop-shadow(0 0 6px #fff) hue-rotate(0deg)}100%{filter:drop-shadow(0 3px 1.5px rgba(0,25,45,.5)) drop-shadow(0 0 6px #fff) hue-rotate(360deg)}}
.mt.sel{z-index:3}
.mt.sel::before{content:"";position:absolute;inset:-8%;border-radius:32%;background:radial-gradient(circle,rgba(255,250,215,.95) 0%,rgba(255,226,110,.55) 45%,transparent 72%);animation:mglow .9s ease-in-out infinite}
.mt.sel .mi{animation:msel .8s ease-in-out infinite}
.mt.hint .mi{animation:mhint 1.1s ease-in-out infinite}
.mt.nope .mi{animation:shake .25s}
.mt.made .mi{animation:mmade .5s cubic-bezier(.3,1.6,.5,1)}
.mt.land .mi{transform-origin:50% 100%;animation:mland .26s var(--ld,0s) ease-out}
.mt.pang{z-index:4;pointer-events:none}
.mt.pang .mi{animation:mpang .3s ease-in forwards}
@keyframes msel{0%,100%{transform:scale(1.06) translateY(0)}50%{transform:scale(1.12) translateY(-3px)}}
@keyframes mhint{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-10deg) scale(1.08)}40%{transform:rotate(9deg) scale(1.08)}60%{transform:rotate(0) scale(1)}}
@keyframes mmade{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
@keyframes mland{0%{transform:scale(1)}40%{transform:scale(1.1,.84)}75%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
@keyframes mpang{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.32);filter:brightness(1.7)}100%{transform:scale(.1);opacity:0;filter:brightness(2)}}
.mring,.mshock{position:absolute;z-index:5;pointer-events:none;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;box-sizing:border-box}
.mring{border:4px solid #fff;animation:mring .45s ease-out forwards}
.mshock{border:6px solid rgba(220,255,255,.95);box-shadow:0 0 20px rgba(200,255,255,.9),inset 0 0 20px rgba(200,255,255,.7);animation:mring .6s ease-out forwards}
@keyframes mring{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.15);opacity:0}}
.mpt{position:absolute;z-index:5;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:mpt .6s cubic-bezier(.2,.7,.4,1) forwards;filter:brightness(1.15)}
@keyframes mpt{0%{transform:translate(0,0) rotate(0) scale(1.3)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(0);opacity:.2}}
.mbeam{position:absolute;z-index:5;pointer-events:none;border-radius:999px;background:linear-gradient(var(--bd,90deg),transparent,rgba(255,250,210,.95) 20%,#fff 50%,rgba(255,250,210,.95) 80%,transparent);box-shadow:0 0 18px 6px rgba(255,240,160,.8)}
.mbeam.h{animation:mbeamh .52s ease-out forwards}
.mbeam.v{--bd:180deg;animation:mbeamv .52s ease-out forwards}
@keyframes mbeamh{0%{transform:scaleX(0) scaleY(.4)}35%{transform:scaleX(1) scaleY(1.1)}100%{transform:scaleX(1) scaleY(.1);opacity:0}}
@keyframes mbeamv{0%{transform:scaleY(0) scaleX(.4)}35%{transform:scaleY(1) scaleX(1.1)}100%{transform:scaleY(1) scaleX(.1);opacity:0}}
.mfloat,.msay{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--disp);white-space:nowrap;paint-order:stroke fill}
.mfloat{font-size:26px;color:#FFF3B3;-webkit-text-stroke:4px #8C4E12;animation:mfloat .9s ease-out forwards}
.msay{font-size:20px;color:#fff;-webkit-text-stroke:4px #2B4C94;animation:mfloat 1.1s ease-out forwards}
@keyframes mfloat{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
.mcombo{position:absolute;left:50%;z-index:8;pointer-events:none;display:flex;flex-direction:column;align-items:center;line-height:.95;transform:translate(-50%,-50%);animation:mcombo 1s cubic-bezier(.2,1.4,.4,1) forwards;font-family:var(--disp);paint-order:stroke fill}
.mcombo b{font-weight:400;font-size:44px;letter-spacing:2px;color:#FFE66B;-webkit-text-stroke:6px #B8421F;text-shadow:0 5px 0 #7A2A10}
.mcombo span{font-size:58px;color:#fff;-webkit-text-stroke:7px #E4553E;text-shadow:0 6px 0 #8A2A15}
.mcombo small{font-size:22px;color:#fff;-webkit-text-stroke:4px #1D6A8C;margin-top:4px}
.mcombo.big b{font-size:52px}.mcombo.big span{font-size:70px}
@keyframes mcombo{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}70%{transform:translate(-50%,-60%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-85%) scale(.92);opacity:0}}
.mpiece{position:relative;display:inline-block;width:52px;height:52px;vertical-align:middle}
.mhow{grid-template-columns:58px 1fr}
.mode .mbig{width:58px;height:58px}
.mode .deco.mdeco{width:70px;height:70px;opacity:.5}
.mode .mbig .mpiece,.mode .mdeco .mpiece{width:100%;height:100%}
@media (max-width:480px){.mstat{min-width:60px}.mstat b{font-size:25px}.mplank{padding:4px 9px 6px}.mgoal small,.mstat small{font-size:13px}.mcombo b{font-size:36px}.mcombo span{font-size:48px}}

/* ---------- 소문 던전 ---------- */
#dungeon{overflow-y:auto;padding:10px 16px 30px;background:linear-gradient(180deg,rgba(238,233,255,.8),rgba(255,225,234,.6))}
.dwrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px}
.hearts{font-size:28px;letter-spacing:1px}
.path{display:flex;align-items:center;gap:4px;margin-left:auto}
.path i{width:14px;height:14px;border-radius:50%;background:#E9E1F3;display:block}
.path i.done{background:var(--lav)}
.path i.now{background:var(--pink);box-shadow:0 0 0 4px var(--pinkL)}
.path i.boss{width:auto;height:auto;background:none;font-style:normal;font-size:24px}
.dstage{padding:18px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.dstage h2{font-size:32px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.door{border-radius:28px 28px 16px 16px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,#B89BE8,#8E6FD3);color:#fff;box-shadow:0 6px 0 #6C51B0;transition:transform .15s}
.door:hover{transform:translateY(-4px)}
.door .em{font-size:54px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.door b{font-family:var(--disp);font-weight:400;font-size:25px}
.door small{font-size:16px;opacity:.95;line-height:1.35}
.door.t-treasure{background:linear-gradient(180deg,#FFD978,#F0B13A);box-shadow:0 6px 0 #C98A1C;color:var(--ink)}
.door.t-game{background:linear-gradient(180deg,#8FE0BE,#3FB98A);box-shadow:0 6px 0 #2B8F69}
.door.t-rest{background:linear-gradient(180deg,#9FD8F5,#4FB7D6);box-shadow:0 6px 0 #328FAB}
.door.t-boss{background:linear-gradient(180deg,#FF9B86,#E4644B);box-shadow:0 6px 0 #B84631}
.monster{font-size:103px;animation:float 2.2s infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.08))}
.monster.hit{animation:hit .4s}
.hpbar{display:flex;justify-content:center;gap:5px}
.hpbar i{width:34px;height:12px;border-radius:999px;background:var(--coral)}
.hpbar i.off{background:#EEE3E8}
.buffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.buff{border-radius:20px;padding:14px 8px;background:var(--cream);box-shadow:0 5px 0 #F0DCC2;display:flex;flex-direction:column;align-items:center;gap:4px}
.buff .em{font-size:40px}
.buff b{font-family:var(--disp);font-weight:400;font-size:22px}
.buff small{font-size:16px;color:var(--ink2)}

/* ---------- 모달 · 퀴즈 · 미니게임 ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(74,56,69,.45);display:grid;place-items:center;padding:16px;animation:fade .2s}
.sheet{background:#fff;border-radius:30px;width:min(580px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;box-sizing:border-box;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.08);animation:up .28s cubic-bezier(.2,1.4,.4,1)}
.sheet h2{font-size:31px}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:#F6EEF2;font-size:22px;color:var(--ink2)}
.talk{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.talk .bubble{background:var(--cream);box-shadow:none;font-size:22px}
.talk .bubble.gull{background:#FFF4D0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:48px}
.qhead .tag{font-size:18px}
.qq{font-size:25px;line-height:1.5;margin:12px 0 14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:13px 15px;border-radius:18px;background:var(--cream);font-size:22px;line-height:1.4;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 #F0DCC2;transition:transform .1s}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:400;color:var(--pink2)}
.opt:hover{transform:translateX(3px)}
.opt.right{background:var(--mintL);box-shadow:0 4px 0 var(--mint)}
.opt.wrong{background:var(--pinkL);box-shadow:0 4px 0 var(--pink);animation:shake .35s}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt[disabled]{cursor:default;transform:none}
.explain{margin-top:14px;padding:13px 15px;border-radius:18px;font-size:20px;line-height:1.5}
.explain.good{background:var(--mintL)}
.explain.bad{background:var(--pinkL)}
.explain strong{font-family:var(--disp);font-weight:400;font-size:25px;display:block;margin-bottom:2px}
.gprompt{font-family:var(--disp);font-size:25px;margin:10px 0 12px}
.gdots{display:flex;gap:5px;margin-left:auto}
.gdots i{width:10px;height:10px;border-radius:50%;background:#EEE3E8}
.gdots i.on{background:var(--mint)}
.oslots{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.oslot{min-height:42px;border-radius:14px;border:3px dashed #EAD9E1;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:20px}
.oslot b{font-family:var(--disp);font-weight:400;width:26px;height:26px;border-radius:50%;background:#F4ECF0;display:grid;place-items:center;flex:none}
.oslot.f{border:0;background:var(--mintL);animation:pop .35s}
.oslot.f b{background:var(--mint2);color:#fff}
.gbtns{display:flex;flex-wrap:wrap;gap:8px}
.gbtn{padding:11px 14px;border-radius:16px;background:var(--lavL);box-shadow:0 4px 0 #D5CAF7;font-size:20px;text-align:left;line-height:1.35}
.gbtn.bad{animation:shake .35s;background:var(--pinkL)}
.gbtn.sel{background:var(--butterL);box-shadow:0 4px 0 var(--butter2)}
.gbtn.ok{background:var(--mintL);box-shadow:0 4px 0 var(--mint);opacity:.7;cursor:default}
.scard{margin:4px auto 14px;max-width:360px;padding:22px 16px;border-radius:24px;background:var(--butterL);box-shadow:0 6px 0 #F0D78C;font-size:25px;font-family:var(--disp);animation:pop .35s;text-align:center}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bin{padding:14px 8px;border-radius:20px;background:var(--mintL);box-shadow:0 5px 0 var(--mint);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--disp);font-size:21px}
.bin .em{font-size:38px}
.bin.bad{animation:shake .35s;background:var(--pinkL);box-shadow:0 5px 0 var(--pink)}
.bin.good{animation:pop .35s}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcols .gbtns{flex-direction:column}
.oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxbtns button{font-size:49px;padding:14px;border-radius:22px;background:var(--cream);box-shadow:0 5px 0 #F0DCC2}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.item{border-radius:18px;padding:12px 8px;background:var(--cream);box-shadow:0 4px 0 #F0DCC2;display:flex;flex-direction:column;align-items:center;gap:3px}
.item .em{font-size:36px}
.item b{font-family:var(--disp);font-weight:400;font-size:21px}
.item small{font-variant-numeric:tabular-nums;color:var(--ink2)}
.item.on{background:var(--mintL);box-shadow:0 4px 0 var(--mint),0 0 0 3px var(--mint)}
.wallet{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 14px;border-radius:16px;background:var(--lavL);font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}
.result{text-align:center;padding:6px 0}
.result .stars{font-size:54px;letter-spacing:4px;margin:8px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.truth{border-radius:24px;padding:20px;background:linear-gradient(180deg,#fff,var(--tintL));box-shadow:0 6px 0 var(--tintD);position:relative;margin-top:12px}
.truth .rm{font-size:20px;color:var(--ink2)}
.truth .rm q{text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:2px}
.truth .stampbig{position:absolute;right:14px;top:-10px;font-family:var(--disp);color:#fff;background:var(--coral);border-radius:999px;padding:4px 12px;transform:rotate(8deg);font-size:22px;box-shadow:0 3px 0 var(--coral2)}
.truth h3{font-size:29px;margin:12px 0 10px}
.truth ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.truth li{display:flex;gap:8px;font-size:21px;line-height:1.45}
.truth li::before{content:"✓";color:#fff;background:var(--tint);border-radius:50%;width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:17px;margin-top:1px}
.howto{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;margin-top:14px;align-items:center;font-size:20px;line-height:1.4}
.howto .em{font-size:35px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:18px;margin-top:10px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid #F1E6EC;vertical-align:top}
.tbl th{font-family:var(--disp);font-weight:400;color:var(--pink2)}
.tw{overflow-x:auto}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #F1E6EC;font-size:21px}
.sw{width:56px;height:32px;border-radius:999px;background:#EDE3E8;position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.sw[aria-checked="true"]{background:var(--mint)}
.sw[aria-checked="true"]::after{left:27px}
.note{font-size:18px;color:var(--ink2);line-height:1.55}
select{font:inherit;padding:6px 8px;border-radius:12px;border:2px solid #EDE3E8;background:#fff;max-width:100%}

/* ---------- 따라 하기 안내 ---------- */
#coach{position:fixed;inset:0;z-index:48;pointer-events:none}
#coach .spot{position:fixed;border-radius:20px;box-shadow:0 0 0 9999px rgba(74,56,69,.5);transition:all .25s;pointer-events:none}
#coach .spot.none{box-shadow:0 0 0 9999px rgba(74,56,69,.5);width:0;height:0;left:50%;top:50%}
#coach .ring{position:fixed;border-radius:20px;border:4px solid var(--butter);animation:ringp 1.2s infinite;pointer-events:none}
#coach .hand{position:fixed;font-size:49px;font-family:var(--emoji);pointer-events:none;z-index:2;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
#coach .hand.tap{animation:tap 1s infinite}
#coach .hand.drag{animation:dragh 1.8s infinite}
#coach .cbox{position:fixed;left:0;right:0;margin:0 auto;width:min(520px,calc(100% - 32px));display:flex;gap:10px;align-items:flex-end;pointer-events:auto;animation:up .3s}
#coach .cbox .bubble{flex:1;font-size:22px;border:3px solid var(--butter)}
#coach .cbox .bubble .row{margin-top:8px}
#coach .skip{font-size:17px;color:var(--ink2);text-decoration:underline;padding:6px}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92%,460px)}
.tst{background:#fff;color:var(--ink);padding:10px 18px;border-radius:999px;font-size:20px;line-height:1.4;animation:up .25s;text-align:center;box-shadow:0 5px 0 rgba(120,90,110,.15),0 10px 20px rgba(0,0,0,.08);font-family:var(--disp)}
.float{position:fixed;z-index:47;pointer-events:none;font-family:var(--disp);font-size:30px;color:var(--butter2);animation:rise 1s forwards;-webkit-text-stroke:1.5px #fff;paint-order:stroke fill}
.confetti{position:fixed;top:-20px;z-index:70;pointer-events:none;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spawn{0%{transform:scale(.2) translateY(10px);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes clr{0%{transform:scale(1)}50%{transform:scale(1.2);filter:brightness(1.6)}100%{transform:scale(0);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-8deg);filter:brightness(2)}60%{transform:translateX(10px) rotate(6deg)}100%{transform:translateX(0)}}
@keyframes combo{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1) translateY(-40px);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes tap{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(0,8px) scale(.9)}}
@keyframes dragh{0%{transform:translate(0,0);opacity:0}15%{opacity:1}75%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes ringp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:640px){
  .stage .talkrow{position:relative;left:auto;right:auto;bottom:auto;padding:10px 12px 12px;background:#fff}
  .stage .bubble{box-shadow:none;background:var(--cream)}
  .modes{grid-template-columns:1fr}
  .mode{flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 12px}
  .mode .big{font-size:45px}
  .mode .mt2{flex:1;min-width:0}
  .mode .rec{margin-top:0}
}
@media (max-width:480px){
  .logo{top:27%}
  .logo h1{font-size:36px;-webkit-text-stroke:1.5px var(--pink2)}
  .logo p{font-size:16px}
  .herobtns .ibtn{width:36px;height:36px;font-size:22px}
  .tile{min-height:0;padding:12px}
  .tile .pl{font-size:22px}
  .tile .ic{width:46px;height:46px;font-size:34px}
  .slot{width:40px;height:40px;font-size:28px}
  .need{width:32px;height:32px;font-size:25px}
  .chipr{font-size:20px;padding:4px 9px 4px 6px}
  .ibtn{width:40px;height:40px}
  .avatar{width:48px;height:48px;font-size:35px}
  .bubble{font-size:19px}
  .sheet{padding:18px}
  .qq{font-size:24px}
}

/* ===== 수업 구조 ===== */
.tts{display:none;flex:none;width:44px;height:44px;border-radius:50%;background:var(--butterL);box-shadow:0 3px 0 #F0D78C;align-items:center;justify-content:center;font-size:22px;margin-left:auto}
body.tts-on .tts{display:inline-flex}
.tts.on{background:var(--butter);animation:bob 1s infinite}
.tts.inl{margin:6px 0 0 0}
.starwin{margin-top:12px;text-align:center;font-family:var(--disp);font-size:44px;color:#fff;-webkit-text-stroke:2px var(--butter2);paint-order:stroke fill;text-shadow:0 4px 0 var(--butter2);animation:pop .5s}
.bigmsg{font-family:var(--disp);font-size:26px;text-align:center;margin:14px 0;line-height:1.5}
.reviewbtn{min-height:52px}
.reviewbtn .cnt{background:#fff;border-radius:999px;min-width:32px;padding:0 8px;font-size:20px}
.lessonchip small{font-size:15px;color:var(--ink2)}
.guessh{text-align:center;font-size:32px;margin:10px 0 12px}
.rumorbig{position:relative;background:var(--tintL,var(--pinkL));border-radius:24px;padding:18px 18px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rumorbig>.em{font-size:40px}
.rumorbig q{flex:1 1 200px;font-family:var(--disp);font-size:clamp(24px,4.4vw,32px);line-height:1.4}
.guessbtns,.vbtns{display:grid;gap:10px;margin:16px 0 6px}
.gpick,.vpick{min-height:60px;border-radius:20px;background:#fff;border:3px solid #F3E4EB;font-family:var(--disp);font-size:26px;display:flex;align-items:center;gap:12px;padding:8px 18px;box-shadow:0 4px 0 rgba(120,90,110,.12);transition:transform .08s}
.gpick .em,.vpick .em{font-size:34px}
.gpick:active,.vpick:active{transform:translateY(3px)}
.gpick:hover,.vpick:hover{border-color:var(--pink)}
.report{background:var(--tintL,var(--pinkL));border-radius:24px;padding:8px 14px;margin-top:10px}
.rsec{display:flex;gap:10px;padding:12px 0;border-bottom:2px dashed rgba(255,255,255,.9)}
.rsec.last{border-bottom:0}
.rsec>div{flex:1;min-width:0}
.rsec .no{flex:none;width:36px;height:36px;border-radius:50%;background:var(--tint,var(--pink));color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:22px}
.rsec small{display:block;font-family:var(--disp);font-size:18px;color:var(--ink2);margin-bottom:2px}
.rsec q,.rsec b{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.4}
.rsec .dim{color:var(--ink2);font-size:19px}
.rq{font-family:var(--disp);font-size:22px;margin:4px 0 0}
.clue{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.clue li{display:flex;gap:8px;font-size:20px;line-height:1.45;background:rgba(255,255,255,.75);border-radius:14px;padding:7px 10px}
.vres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.vline{background:#fff;border-radius:16px;padding:8px 12px}
.vline small{margin:0}
.vline b{font-size:22px}
.truthline{box-shadow:inset 0 0 0 3px var(--tint,var(--pink))}
.explain.soft{background:var(--lavL)}
.explain .why{display:block;font-family:var(--disp);font-weight:400;font-size:22px;margin:4px 0 2px}
.fbk{margin-top:10px;display:flex;gap:10px;align-items:flex-start;background:var(--butterL);border-radius:18px;padding:12px 14px;font-size:20px;line-height:1.5}
.fbk .em{font-size:30px}
.cbtn.sm{font-size:19px;padding:8px 14px;min-height:44px}
#recap{position:fixed;inset:0;z-index:80;overflow:auto;background:linear-gradient(180deg,#FFF6FA,var(--tintL,var(--pinkL)));padding:clamp(16px,3vw,48px);box-sizing:border-box;animation:fade .2s}
#recap[hidden]{display:none}
.rclose{position:fixed;top:14px;right:14px;min-height:48px;padding:6px 18px;border-radius:999px;background:#fff;font-family:var(--disp);font-size:22px;box-shadow:0 4px 0 rgba(120,90,110,.15);z-index:2}
.rcwrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:100%;justify-content:center}
.rblk{background:#fff;border-radius:28px;padding:clamp(12px,2vh,26px) clamp(16px,3vw,40px);box-shadow:0 6px 0 rgba(120,90,110,.1)}
.rblk small{display:block;font-family:var(--disp);font-size:clamp(20px,2.4vw,34px);color:var(--tint,var(--pink2))}
.rblk .big{margin:4px 0 0;font-family:var(--disp);font-size:clamp(28px,4.4vw,68px);line-height:1.3}
.rblk ol{margin:6px 0 0;padding-left:1.3em;font-family:var(--disp);font-size:clamp(24px,3.4vw,52px);line-height:1.35}
.truthblk{box-shadow:inset 0 0 0 5px var(--tint,var(--pink)),0 6px 0 rgba(120,90,110,.1)}
.rblk.ask{background:var(--butterL)}
.rarrow{text-align:center;font-family:var(--disp);font-size:clamp(24px,3vw,44px);color:var(--ink2);line-height:1}
.sheet.teach{width:min(720px,100%)}
.tabs{display:flex;gap:8px;margin:10px 0 14px;background:var(--pinkL);padding:5px;border-radius:999px}
.tab{flex:1;min-height:48px;border-radius:999px;font-family:var(--disp);font-size:22px;color:var(--ink2)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(120,90,110,.12)}
.tstep{font-family:var(--disp);font-size:22px;margin:14px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tstep b{width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:400;font-size:18px}
.tstep small{font-size:17px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 16px;border-radius:999px;background:#fff;border:3px solid #F3E4EB;font-family:var(--disp);font-size:21px}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.zpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:min(42vh,360px);overflow:auto;padding:2px}
.zone{position:relative;min-height:60px;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid #F3E4EB;border-radius:18px;padding:8px 10px}
.zone .em{font-size:30px}
.zone .zt{display:flex;flex-direction:column;min-width:0}

/* ---------- 저장 ---------- */
let S;
function freshState(){return {v:2,energy:MAX_E,last:Date.now(),coins:20,sound:true,unlimited:false,grade:0,tut:{},ch:{}}}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&o.v===2) return Object.assign(freshState(),o);}}catch(e){}
  try{const r=localStorage.getItem(OLDKEY); if(r){const o=JSON.parse(r); if(o&&o.v===1){const n=freshState(); n.coins=o.coins||20; n.sound=o.sound!==false; n.unlimited=!!o.unlimited;
    Object.keys(o.ch||{}).forEach(id=>{const c=o.ch[id]; n.ch[id]={board:c.board,step:c.step||0,stars:c.stars||0,orders:c.orders||[],done:!!c.done,intro:!!c.intro}}); return n}}}catch(e){}
  return freshState();
}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)}
S=load();
function chState(ci){
  const id=CH[ci].id;
  if(!S.ch[id]) S.ch[id]={step:0,stars:0,done:false,intro:false};
  const c=S.ch[id];
  if(!c.board) freshBoard(ci,c);
  if(c.best==null) c.best=0; if(c.dBest==null) c.dBest=0; if(c.dWins==null) c.dWins=0;
  return c;
}

let AC=null;
function beep(f=520,d=.09,type='sine',v=.08,slide=0){
  if(!S.sound) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}

  spawn:()=>beep(700,.07,'triangle',.06,1.3),

  ok:()=>[587,740,880,1175].forEach((f,i)=>setTimeout(()=>beep(f,.13,'sine',.08),i*85)),
  no:()=>beep(220,.2,'square',.035,.7),
  tap:()=>beep(420,.05,'sine',.045,1.2),
  place:()=>beep(330,.06,'triangle',.07,1.4),
  clear:n=>[660,880,1046,1318].slice(0,Math.min(4,n+1)).forEach((f,i)=>setTimeout(()=>beep(f,.12,'sine',.08),i*70)),
  hit:()=>{beep(180,.12,'sawtooth',.05,.5);setTimeout(()=>beep(900,.08,'square',.04,1.5),60)},
  hurt:()=>beep(160,.3,'triangle',.08,.5)
};

function hxPort(){return window.innerWidth/window.innerHeight<1.25}
let HXP=null; window.addEventListener('resize',()=>{if(SCREEN==='hub'&&HXP!==hxPort())renderHub()});
function hxStarIcon(){return `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#miStar"/></svg>`}
function renderHub(){
  const ch=CH[CI], c=chState(CI);
  const cost=STEP_COST[Math.min(c.step,3)], ready=!c.done&&c.stars>=cost;
  const prev=$('#hxScroll'), keepX=prev&&HXP===hxPort()?prev.scrollLeft:null; HXP=hxPort();
  let say, questT;
  if(c.done){say=`진실을 밝혀 줘서 고마워요! “${ch.truth.title}” 놀이는 계속 할 수 있어요.`;questT='진실 확인 완료! 더 놀면서 별을 모아요'}
  else if(c.step===0){say=`“${ch.rumor}” 이런 소문이 돌아요. 진짜일까요? 놀이로 ⭐을 모아 단서를 찾아 주세요!`;questT='소문의 진실을 밝혀라 · 단서 0/4'}
  else{say=`단서를 ${c.step}개 찾았어요! 조금만 더 모으면 소문의 진실이 밝혀져요.`;questT=`소문의 진실을 밝혀라 · 단서 ${c.step}/4`}
  $('#hubwrap').innerHTML=`
  <div class="hx ${ART.hub_bg?'painted':''}" style="${tintVars(ch)}">
    <div class="hxscroll" id="hxScroll">${hubWorld(ch,c,hxPort())}</div>
    <div class="hxvig"></div>${hxPort()?'<div class="hxswipe l" aria-hidden="true"></div><div class="hxswipe r" aria-hidden="true"></div>':''}
    <div class="hxhud">
      <div class="hxL">
        ${ART.hub_bg?'':'<div class="hxportrait"><img src="assets/hero.webp" alt=""></div>'}
        ${S.lesson?`<button class="hxslot hxbtn" id="hBack" aria-label="수업 모드" title="수업 모드"><svg viewBox="0 0 40 40"><path d="M6 10 Q20 4 20 10 Q20 4 34 10 V32 Q20 26 20 32 Q20 26 6 32Z" fill="#FFE27A" stroke="#4E2C14" stroke-width="2.5"/><path d="M20 10 V32" stroke="#4E2C14" stroke-width="2"/></svg></button><span class="hxlesson"><small>오늘의 수업</small>${S.lesson.dur?`<span id="lessonT">${lessonLeft()}</span>`:'<span>자유 놀이</span>'}</span>`:
          `<button class="hxslot hxbtn" id="hBack" aria-label="항구 지도로" title="항구 지도로"><svg viewBox="0 0 40 40"><path d="M5 9 L14 6 L26 10 L35 7 V31 L26 34 L14 30 L5 33Z" fill="#F7E9C9" stroke="#4E2C14" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 6 V30 M26 10 V34" stroke="#4E2C14" stroke-width="2"/><path d="M9 20 Q16 14 22 22 T31 18" stroke="#C8453E" stroke-width="2.5" fill="none" stroke-dasharray="2 3"/></svg></button>`}
      </div>
      <div class="hxC">
        <div class="hxplaque"><small>${esc(ch.theme)}</small><b>${esc(ch.place)}</b></div>
        <div class="hxquest"><span class="qi">임무</span><span class="qt">${esc(questT)}</span></div>
      </div>
      <div class="hxR">
        <div class="hxslot hxstars" title="이 구역의 별">${hxStarIcon()}<b class="sVal">${c.stars}</b></div>
        <div class="hxclues" id="hTrail" title="찾은 단서">${ch.steps.map((s,k)=>`<span class="hxclue ${k<c.step?'on':''} ${k===c.step-1&&c._pop?'pop':''}" title="${esc(s.title)}"><img src="assets/shard.webp" alt=""></span>`).join('')}</div>
        <button class="hxslot hxbtn" id="hHelp" aria-label="안내 다시 보기" title="안내 다시 보기"><svg viewBox="0 0 40 40"><text x="20" y="29" text-anchor="middle" font-family="Jua" font-size="26" fill="#FFE27A">?</text></svg></button>
      </div>
    </div>
    <div class="hxdlg" id="hDlg">
      <div class="hxpframe">${villagerSVG(ch.npc,ch.tint)}</div>
      <div class="hxdbody"><b class="hxdname">${esc(ch.npc.name)}</b><p class="hxdtext">${esc(say)}</p>
        <div class="hxdbtns">
          ${c.done?`<button class="hxplank hot" id="hStory">진실 카드 보기</button>`:
            `<button class="hxplank ${ready?'hot':''}" id="hStory">${ready?'이야기 열기!':'다음 이야기'} · <span class="hxcost">${hxStarIcon()}${cost}</span></button>`}
          ${(c.wrong&&c.wrong.length)?`<button class="hxplank" id="hReview" title="헷갈린 문제 다시 풀기">다시 풀기 <b class="cnt">${c.wrong.length}</b></button>`:''}
          <button class="hxplank" id="hClassic" title="문을 골라 싸우는 빠른 카드 던전 · ${c.dWins?`승리 ${c.dWins}번`:`최고 ${c.dBest}층`}">카드 던전</button>
        </div></div>
    </div>
  </div>`;
  c._pop=false;
  const sc=$('#hxScroll');
  requestAnimationFrame(()=>{if(sc.scrollWidth>sc.clientWidth)sc.scrollLeft=keepX!=null?keepX:Math.max(0,sc.scrollWidth*(1010/HXW)-sc.clientWidth/2)});
  $('#hBack').onclick=()=>{sfx.tap();if(S.lesson)teacherModal();else goMap()};
  const rv=$('#hReview'); if(rv) rv.onclick=()=>{sfx.tap();reviewWrong()};
  $('#hHelp').onclick=()=>{sfx.tap();coachStart(hubTutorial())};
  $('#hStory').onclick=()=>storyButton();
  $('#hClassic').onclick=()=>{sfx.tap();openDungeon()};
  const go={mMerge:openMerge,mBlock:openBlock,mMatch:openMatch,mDrop:openDrop,mDungeon:openCave};
  Object.entries(go).forEach(([id,fn])=>{const el=$('#'+id); if(!el)return;
    const run=()=>{if(sc._drag&&sc._drag.moved)return;sfx.tap();fn()};
    el.addEventListener('click',run); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}})});
  /* 좁은 화면: 손가락/마우스로 끌어서 항구를 둘러봐요 */
  sc.onpointerdown=e=>{if(e.pointerType==='touch')return;sc._drag={x:e.clientX,l:sc.scrollLeft,moved:false}};
  sc.onpointermove=e=>{const d=sc._drag;if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>6)d.moved=true;if(d.moved)sc.scrollLeft=d.l-dx};
  sc.onpointerup=sc.onpointerleave=()=>{setTimeout(()=>{sc._drag=null},0)};
}

function storyButton(){
  const c=chState(CI);
  if(c.done){showTruth(CI,false);return}
  const cost=STEP_COST[c.step];
  if(c.stars<cost){toast(`⭐ ${cost-c.stars}개가 더 필요해요! 놀이에서 모아 와요`);sfx.no();return}
  coachEmit('story'); startStory(CI,c.step);
}
function hubTutorial(){
  const ch=CH[CI];
  return [
    {who:'gull',target:()=>$('#hDlg'),text:`여기는 ${ch.place}! ${ch.npc.name}이(가) 소문 때문에 걱정이 많대. 소문이 진짜인지 탐정님이 밝혀 줘!`,wait:'next'},
    {who:'gull',target:()=>$('#mMerge'),text:'반짝이는 고리가 있는 곳이 놀이터야! 부두, 시장 창고, 보물 해변, 등대 절벽, 안개 동굴 성 — 어디든 눌러서 ⭐별을 모아!',wait:'next'},
    {who:'gull',target:()=>$('#hStory'),text:'⭐이 모이면 이 단추를 눌러 봐. 이야기 속 퀴즈와 미니게임을 풀면 🔍단서를 얻고, 단서 4개면 진실이 밝혀져!',wait:'next'}
  ];
}

function openModal(html,{onClose,closable=true}={}){ttsStop();
  modal.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${closable?'<button class="x" aria-label="닫기">✕</button>':''}${html}</div>`;
  modal.hidden=false; modal._close=onClose;
  const x=modal.querySelector('.x'); if(x) x.onclick=closeModal;
  return modal.querySelector('.sheet');
}
function closeModal(){ttsStop();modal.hidden=true;modal.innerHTML='';const f=modal._close;modal._close=null;if(f)f()}
modal.addEventListener('click',e=>{if(e.target===modal&&modal.querySelector('.x'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden&&modal.querySelector('.x'))closeModal()});
function talkHTML(ch,w,text){
